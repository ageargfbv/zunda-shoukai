@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f130d;
    --surface: #171c14;
    --chip: #232a1f;
    --chip-on: #eef3e8;
    --chip-on-ink: #0f130d;
    --ink: #eef3e8;
    --muted: #9aa692;
    --line: #283024;
    --accent: #8fd17a;
    --accent-soft: #1f2c1a;
    --stage: #000000;
    --sheet: #1b2118;
    --scrim: rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f130d;
  --surface: #171c14;
  --chip: #232a1f;
  --chip-on: #eef3e8;
  --chip-on-ink: #0f130d;
  --ink: #eef3e8;
  --muted: #9aa692;
  --line: #283024;
  --accent: #8fd17a;
  --accent-soft: #1f2c1a;
  --stage: #000000;
  --sheet: #1b2118;
  --scrim: rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "M PLUS 1p", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
input { font-size: 16px; font-family: inherit; }
.app { max-width: 520px; margin-inline: auto; min-height: 100%; padding-bottom: calc(var(--navh) + 6px + var(--navpad)); }

/* 上の帯 */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px 8px;
}
.logo { display: flex; align-items: center; gap: 8px; font-family: "Dela Gothic One", "M PLUS 1p", sans-serif; font-size: 21px; letter-spacing: .02em; }
.logo i { width: 34px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.logo i::after { content: ""; border-left: 10px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
.top h1 { font-size: 22px; font-weight: 800; margin: 0; }

/* チップ */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--chip); border-radius: 9px; padding: 6px 14px; font-weight: 500; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; font-size: 12px; }

/* サムネイル */
.th {
  position: relative; container-type: inline-size;
  aspect-ratio: 16 / 9; width: 100%; max-width: 100%; overflow: hidden;
  color: #fff; display: flex; flex-direction: column; justify-content: center;
  padding: 7cqw 6cqw 8cqw;
}
.th { --h: 140; }

先に消すので、按分ではなく優先して配る","check":"のれんの残高が、事業ごとののれんの合計からのれんに配った減損を引いた額と一致しているか","trap":["例外法で減損をのれんの配分額と本体に按分する ―― のれんから優先。按分するのは共用資産の例外法","例外法でより大きな単位の割引前CFを使って判定する ―― のれんを配った後の各グループで判定","回収可能価額まで下げ済みのグループにも超過額を配る ―― 配らない"],"skip":["兆候の無い事業は、のれんを分けたあとは計算しなくてよい","増加額がのれんの帳簿価額に収まるなら、グループへの配分は考えなくてよい"]}]}},{"id":"z29-1","no":"財理29-1","title":"税効果会計の仕組み","sub":"商会","ch":16,"probs":["商会16-1","商会16-2"],"w":0.468,"wt":["税効果会計・法人税等の計算が手つかず"],"hl":"","acct":"商会","core":{"t":"会計と税務の差のうち、いずれ解消する一時差異に税率を掛ける（永久差異には掛けない）。将来減算＝今は前払い＝DTA、将来加算＝DTL","ab":[["資産負債法（現行）","解消時の税率。税率が変われば再計算。B/Sの差（一時差異）が対象"],["繰延法（不採用）","発生時の税率のまま再計算しない。今年のP/Lが合う（P/L重視）"]],"parts":[{"h":null,"judge":[["「交際費の損金不算入額」「寄付金の損金算入限度超過額」「受取配当金の益金不算入額」","永久差異。税効果の対象外で、DTAの計算から外す（差が永久に縮まらず、一生消えないDTAが残るから）"],["「貸倒引当金の繰入限度超過額」「減価償却費の損金算入限度超過額」","将来減算一時差異。期末の差異の合計×税率がDTA。前期末より増えた分が法人税等調整額（貸方）"],["「税法上、貸倒引当金は全額否認される」","会計上の貸倒引当金の残高がそのまま将来減算一時差異（税務は見込みの費用を認めない）"],["「税率の改正があった場合でも…新たな税率による再計算は行わない」","×。資産負債法は解消時の税率を使い、税率が変われば過年度のDTA・DTLも再計算する。再計算しないのは繰延法"]],"steps":[["なぜ会計と税務がずれるか","会計は適正な期間損益計算、税務は課税の公平。目的が違うので、見積りの費用（貸倒引当金繰入額・減損損失）を税務は認めない"],["適用しないと何がダメか","P/Lは税引前当期純利益と法人税等が対応しない。B/Sは税金の前払いが表れない。適用するとP/LもB/Sも丸になる"],["将来減算はDTAと言い切る","通算の利益は同じなので、将来課税所得が小さい＝今は税務署が多く取る＝前払い＝DTA。将来加算は逆でDTL"],["目的はP/L、処理はB/S","基準の目的は法人税等の期間配分（収益費用アプローチ）。処理は資産負債法で、解消時の税率を使い税率変更で再計算する"],["対象の範囲を言い分ける","一時差異（B/Sの差）は期間差異（P/Lの差）を内包し、その評の分だけ広い。永久差異は対象外、繰越欠損金等は一時差異に準じてDTA"]],"why":"差は通算すれば消えるので、今の差は将来の税金の前払いか後払い。一生消えない差にDTA・DTLを立てるとB/Sに残り続ける","check":"","trap":["永久差異（交際費・寄付金・罰科金・受取配当金）を一時差異の合計に足す ―― 差が縮まらないので対象外","将来減算を「将来の税金が増える」と読んでDTLにする ―― 将来課税所得が減る＝今は前払い","資産負債法で発生時の税率を使う ―― 使うのは解消時の税率。発生時の税率は繰延法"],"skip":["2018年改正でDTA・DTLは全部固定。流動・固定に分けなくてよい","DTLは特別償却準備金・圧縮積立金の2つを覚えれば足りる（その他有価証券の評価益・前払年金費用は、評価損・退職給付引当金の逆）"]}]}},{"id":"z29-2","no":"財理29-2","title":"税効果の表示と回収可能性","sub":"商会","ch":16,"probs":["商会16-6","商会16-3","商会16-4","商会16-7","商会16-5"],"w":0.468,"wt":["税効果会計・法人税等の計算が手つかず"],"hl":"","acct":"商会","core":{"t":"DTAは将来の税金を減らせる分だけ立て、毎期見直す。相手は原則として法人税等調整額、P/Lに差が出ないものだけ純資産","ab":[],"parts":[{"h":null,"judge":[["その他有価証券は「全部純資産直入法」","評価差額は一時差異の分析から外す。DTL（DTA）の相手はその他有価証券評価差額金で、法人税等調整額は出ない"],["その他有価証券は「部分純資産直入法」で、時価が取得原価を下回る","評価損がP/Lに出るので、他の一時差異と同じく分析に入れて法人税等調整額を通す（P/Lに差が出れば原則どおり）"],["圧縮記帳で「積立金方式を採用」","将来加算一時差異でDTL。積み立てる圧縮積立金は、圧縮額から税効果（DTL）を引いた額"],["「繰延税金負債は、将来の法人税等の支払額を減額する効果」","×。減額するのはDTA（前払い）。DTLは後払いで、将来の支払額を増額する"]],"steps":[["表示は全部固定、相殺は同じ会社","DTAは投資その他の資産、DTLは固定負債。同じ納税主体のDTAとDTLは相殺し、親会社と子会社のように別の納税主体どうしは相殺しない"],["立てるのは減らせる税金まで","将来の課税所得が足りなければ、減らせる分しか立てない。立てた後も毎期見直し、見込みが良くなれば戻せる（減損と違う）"],["回収可能性は3段階の順に見る","収益力に基づく課税所得→タックスプランニング→将来加算一時差異（DTL）。DTLは原則見直さない（払う負債だから）"],["相手勘定の例外を言う","原則は法人税等調整額。その他有価証券評価差額金と、子会社の時価評価の評価差額はP/Lに差が出ないので、相手は純資産"],["税率変更の相手を分ける","通常は法人税等調整額。子会社の時価評価は評価差額を動かせないので法人税等調整額。その評は毎期評価し直すのでその評"]],"why":"法人税等調整額はP/Lの差を埋めるための科目。P/Lに差が出ていなければ、相手を純資産に置くしかない","check":"法人税等（調整額を足した後）÷税引前当期純利益が法定実効税率とずれたら、ずれが永久差異（交際費など）で説明できるか","trap":["全部純資産直入法のその他有価証券を一時差異の合計に混ぜて法人税等調整額を出す ―― 相手はその評","親会社のDTAと子会社のDTLを連結B/Sで相殺する ―― 別の納税主体は相殺しない","圧縮積立金を圧縮額のまま積み立てる ―― 積むのはDTLを引いた残り"],"skip":["土地再評価差額金は時限立法で、今は新たに再評価できない。売ったら繰越利益剰余金へ直接入る（P/Lを通らない）ことだけ押さえる"]}]}},{"id":"n21-1","no":"財計21-1","title":"株主資本等変動計算書と新株予約権 取得者側と自己新株予約権","sub":"商会","ch":21,"probs":["商会21-7","商会21-8"],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"株主資本は変動事由ごと、株主資本以外は純額1行が原則。内訳を求められたら首・発生・組替調整・末を並べ、税引後で書く","ab":[["株主資本","当期変動額を変動事由ごとに書く（新株の発行・剰余金の配当・当期純利益など）"],["株主資本以外","当期変動額は純額1行が原則。答案用紙に内訳の行があれば例外のひな型で埋める"]],"parts":[{"h":null,"judge":[["「株主資本以外の項目の当期変動額（純額）」の1行","原則のひな型。その他有価証券評価差額金も新株予約権も、期末−期首の純額で書く"],["「株主資本以外の項目の当期変動額を変動事由ごとに表示すること」","例外のひな型。売却による増減＝組替調整額、直接計上された増減＝当期発生額に分ける"],["その他有価証券の残高が「取得原価」と「時価」の2本","期首と期末は時価−取得原価。税効果があれば（1−税率）を掛けて税引後に直す"],["新株予約権を「売買目的有価証券として保有する場合」の権利行使","行使時の時価まで評価し、差額を有価証券評価損益に。その他有価証券なら帳簿価額のまま株式へ"]],"steps":[["原則か例外かを決める","答案用紙に株主資本以外の内訳の行があるかを見る。無ければ純額1行"],["期首と期末を埋める","前期末と当期末それぞれ、時価−取得原価"],["組替調整額を置く","売却益の貸借を逆にする。売却益が出たらその他有価証券評価差額金を減らす向き"],["当期発生額を差額で出す","期末−期首に、組替調整で減った分を戻す"],["税引後に直して写す","4つとも（1−税率）を掛けてから株主資本等変動計算書に書く"]],"why":"株主資本等変動計算書は貸借対照表とつながっている。だから金額は税引後で、期首と期末はB/Sの残高と一致する","check":"列ごとに、当期首残高＋当期変動額合計＝当期末残高（貸借対照表の金額）になる","trap":["組替調整額をプラスで書く ―― 売却益が貸方なので、組替調整額は借方＝減る向き","税効果前の金額を写す ―― 貸借対照表が税引後なので、ここも税引後","取得者側の不行使を益にする ―― 取得者側は新株予約権不行使損（特別損失）、益は発行者側の戻入益"],"skip":["自己新株予約権の減損（時価と対応する新株予約権の帳簿価額の比較）は1級の範囲外の印"]}]}},{"id":"z31-1","no":"財理31-1","title":"会計上の変更と誤謬の4類型","sub":"商会","ch":22,"probs":["商会22-2"],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"4類型のうち遡らないのは見積りの変更（△→○）だけ。方針・表示は○→○で正当な理由が要り、誤謬は×→○","ab":[["遡及する","会計方針の変更（遡及適用）・表示方法の変更（組替え）・誤謬の訂正（修正再表示）"],["遡及しない","会計上の見積りの変更と「はいしじみ」（範囲・新たな事実・重要性の増大・見積り）"]],"parts":[{"h":null,"judge":[["「会計方針は、（ ）により変更を行う場合を除き、毎期継続して適用する」","正当な理由。自発的な変更の要件は、経営環境の変化への対応と、財務諸表により適切に反映するため"],["「会計基準等の改正に伴う」変更で「特定の経過的な取扱い」が定められている","経過的な取扱いに従う（遡らないことがある）。自発的な変更は過去の期間のすべてに遡及適用"],["誤謬を「意図的でない虚偽の表示」とする","×。この基準は意図的か否かを問わず誤謬に含める（どちらも修正再表示で遡るから）。意図で分けるのは監査論"],["「重要性が増したことに伴う、本来の会計処理の原則及び手続への変更」","会計方針の変更に該当せず遡及しない（はいしじみの「じ」）。方法を選び直したのではなく、簡便にしていた処理を本来に戻しただけ"]],"steps":[["できた背景を2つ言う","従来は純利益への影響を注記するだけ。国際的な会計基準との調和化と、2期比較の比較可能性の向上のため遡及する基準になった"],["定義で方針と表示を分ける","会計方針は処理の原則及び手続で金額が変わる（実質）。表示方法は金額が変わらない（形式）。企業会計原則では方針が表示を含んでいた"],["4類型を記号で言い分ける","方針・表示は○→○で継続性の原則（正当な理由）。見積りは△→○で遡らない。誤謬は×→○で、不正も含めて修正再表示"],["遡る範囲と重要性","財務諸表のすべての項目を、連結だけでなく個別も遡る（事務負担より比較可能性を優先）。ただし重要性は考慮する"],["方針と表示の境目","背景に会計方針の変更があれば方針の変更、無ければ表示方法の変更。迷ったら金額が動くかで分ける。CFの資金の範囲は方針、内訳は表示"]],"why":"並べる2期が同じ方法でないと比べられない。だから正しい方法どうしの変更と誤りは遡り、当時は合理的だった見積りの変更は遡らない","check":"","trap":["「会計上の変更」に誤謬の訂正を入れる ―― 会計上の変更は方針・表示・見積りの3つ","「遡及処理」と「遡及適用」を同じ意味で使う ―― 遡及適用は方針の変更だけの呼び名、遡及処理は3つの総称","基準改正に伴う変更もすべて遡及適用と答える ―― 経過的な取扱いがあればそれに従う"],"skip":["「はいしじみ」は語呂と例1つずつで足りる（受取利息を発生主義へ・初めての社債発行費・子会社が10社から7社）"]}]}},{"id":"z31-2","no":"財理31-2","title":"遡及処理の具体と注記","sub":"商会","ch":22,"probs":["商会22-3","商会22-1"],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"遡るなら累積的影響額を前期首の利益剰余金に入れ、見積りの変更は当期以降。誤謬との分かれ目は、過去の見積りがその時点で最善だったか","ab":[],"parts":[{"h":null,"judge":[["「棚卸資産の評価方法を総平均法から先入先出法に変更する会計方針の変更」","遡及適用。前期も新しい方法の数字で作り直し、前期首の差を「会計方針の変更による累積的影響額」として区分表示"],["「当期首において、耐用年数の見直しを行い」","会計上の見積りの変更。遡らず、当期首の未償却残高を残りの年数で割る（プロスペクティブ方式）。前期の数字は動かさない"],["「減価償却方法を定率法から定額法に変更する会計方針の変更」","区分することが困難な場合。見積りの変更と同じく遡らない。注記は方針の変更と同じく正当な理由も書く"],["「その時点での合理的な見積りに基づくものでなく」","過去の誤謬。修正再表示で前期を直す。その時点で合理的（最善）だったなら見積りの変更"]],"steps":[["累積的影響額の置き場所","表示する最も古い期間の期首＝2期比較なら前期首。動くのは利益剰余金。前期の各項目も新しい方法の数字にする"],["区分表示する理由","前期首残高・累積的影響額・遡及処理後の残高を分けて出す。累積的影響額は業績ではなく、混ぜると前々期末残高ともつながらない"],["前期首でなくてよい場合","会社に落ち度が無い2つ（経過的な取扱い・暫定的な会計処理の確定）は当期首。落ち度がある実務上不可能は、できる最も古い期首から"],["見積りの変更は当期以降","プロスペクティブ方式。貸倒見積額の変更は当期だけ、耐用年数の変更は当期と将来に効く。注記するのは当期への影響額"],["誤謬は最善だったかで分ける","過去の見積りがその時点で合理的なら見積りの変更、合理的でなければ誤謬で修正再表示。誤謬には実務上不可能の定めが無い"]],"why":"遡るのは2期を同じ土台で比べるため。見積りの変更は当期に入手した新しい情報によるので、過去は正しかったとして将来に向けて直す","check":"遡及処理後の期首残高に当期純利益を足すと、直した後のB/Sの繰越利益剰余金と一致する","trap":["会計方針の変更の注記に当期への影響額を書く ―― 日本は原則、過去の期間だけ（IFRSは当期も）","耐用年数の変更で前期の減価償却費を直す ―― 見積りの変更は遡らない","累積的影響額を期首残高に混ぜて1行で出す ―― 区分表示して、遡及処理後の期首残高を別に書く"],"skip":["重要性の大・中・小のうち、ここで扱う遡及は中。小は当期の損益に含め、大は過去すべての訂正報告書","会計上の見積りの開示（2020年）は、B/Sの資産・負債について見積りの内容を注記する、で足りる"]}]}},{"id":"r24-1","no":"財計24-1","title":"収益認識の5つのステップ ― 基準ができた経緯と全体像","sub":"商会","ch":24,"probs":[],"w":0.468,"wt":["収益認識（返金負債・工事進行基準に近い進捗度計算）が手つかず"],"hl":"","acct":"商会","core":{"t":"契約を履行義務に分けて取引価格を配分し、履行義務を充足した時に又は充足するにつれて収益を認識する","ab":[],"parts":[{"h":null,"judge":[["パソコン本体にサポートサービスが付いた契約","本体とサポートが別個の財又はサービスなら、2つの履行義務に分ける"],["販売する契約を締結した（引渡しも対価の受取りもまだ）","契約しただけなので仕訳なし。移転も対価の受取りも無く、契約資産・契約負債が生じない"],["製品を引き渡す前に顧客から対価を受け取った","（借）現金など／（貸）契約負債。引き渡す義務が残るので売上はまだ立てない"],["前受けしていた製品を引き渡した","（借）契約負債／（貸）売上。履行義務を充足したので契約負債を売上に振り替える"]],"steps":[["ステップ1 契約を識別する","講師の図では、契約で対価を受け取る権利と財・サービスを引き渡す義務が同時に生じると考える"],["ステップ2 履行義務を識別する","契約の中の別個の財又はサービスを移転する約束を、それぞれ履行義務として分ける（例 本体とサポート）"],["ステップ3 取引価格を算定する","契約全体でいくら受け取る権利があるかを決める"],["ステップ4 取引価格を配分する","独立販売価格の比率に基づき、取引価格をそれぞれの履行義務に分ける"],["ステップ5 収益を認識する","履行義務を充足した時に又は充足するにつれて、配分した額で収益を認識する"]],"why":"事業内容が多様化・複雑化し、実現主義の定めだけでは収益をいつ認識するか判断が難しく、比較可能性の確保やIFRS第15号との調和も必要だったから","check":"契約しただけの日に仕訳を書いていないか。前受けした対価を売上ではなく契約負債にしているか","trap":["契約を結んだ時点で売上を計上する ―― 正しくは履行義務を充足するまで収益は認識しない","先に受け取った対価を売上にする ―― 正しくは契約負債を計上し、引き渡した時に売上へ振り替える","収益認識基準で企業会計原則も廃止された ―― 正しくは廃止は工事契約基準とソフトウェア取引の実務上の取扱い"],"skip":["契約を結んだだけ（引渡しも対価の受取りも無い）の日の仕訳 ―― 契約資産も契約負債もまだ生じないので仕訳なしで合っている"]}]}},{"id":"r24-2","no":"財計24-2","title":"契約資産・契約負債と5ステップの具体例 ― 例題1・2","sub":"商会","ch":24,"probs":["商会24-6"],"w":0.468,"wt":["収益認識（返金負債・工事進行基準に近い進捗度計算）が手つかず"],"hl":"","acct":"商会","core":{"t":"履行義務を充足した時に又は充足するにつれて収益を認識する。無条件の権利になるまでは契約資産、先に受け取った対価は契約負債","ab":[],"parts":[{"h":null,"judge":[["両方が顧客に引き渡されるまで、対価に対する無条件の権利を有さない","先に引き渡した製品の対価は契約資産。全部を引き渡した時に売掛金へ振り替える"],["対価を受け取り、その後に製品を引き渡した","受取時は契約負債。引渡時に契約負債を取り崩して売上"],["当期首から翌期末まで保守サービスを行う","一定の期間にわたり充足する履行義務。この具体例では配分額2,000を2年で割り、1年1,000ずつ売上"],["独立販売価格は10,000円、2,000円とする","取引価格を独立販売価格の比率で各履行義務に配分する"]],"steps":[["契約を識別する","顧客との契約をつかむ(製品A・Bを1,200で販売する契約なら、その契約全体)"],["履行義務に分ける","契約の中の約束を履行義務に分け、収益を認識する単位にする"],["取引価格を算定する","契約全体でいくらかを決める"],["取引価格を配分する","独立販売価格の比率に基づいて各履行義務に配る"],["充足に応じて収益を認識","一時点で充足した時か、一定の期間にわたり充足するにつれて売上にする"]],"why":"ステップ1・2で単位、3・4で金額、5で時期を決め、収益をいつ・いくらで計上するかを細かく定めるため","check":"製品A・Bを別々に引き渡す例で、売上400＋800＝1,200が最後の引渡時の売掛金1,200と一致するか","trap":["製品Aの引渡し時に売掛金400 ―― 正しくは契約資産400(製品Bの引渡しまで無条件の権利が無い)","対価の受取時に売上1,000 ―― 正しくは契約負債1,000(製品の引渡しで売上)","保守サービス分2,000を当期首に全額売上 ―― 正しくは2年にわたり1,000ずつ売上"],"skip":["契約日の仕訳 ―― 契約資産・契約負債の基本の例では、仕訳は引渡日と対価の受取日だけで、契約を結んだだけの日には無い","商品Xと保守サービスの例の按分計算 ―― この例では独立販売価格の合計12,000が取引価格と同じなので、10,000と2,000のまま"]}]}},{"id":"r24-3","no":"財計24-3","title":"製品保証とポイント制度 ― 契約の定義と例題3・4","sub":"商会","ch":24,"probs":["商会24-1","商会24-2"],"w":0.468,"wt":["収益認識（返金負債・工事進行基準に近い進捗度計算）が手つかず"],"hl":"","acct":"商会","core":{"t":"追加保証とポイントは取引価格を配分して契約負債にし、履行につれて売上へ。基本保証は引当金","ab":[],"parts":[{"h":null,"judge":[["合意された仕様に従って機能するという保証（基本保証）","履行義務にしない。見積った費用を製品保証引当金繰入額／製品保証引当金で計上"],["あらゆる欠陥について修理または交換が行われる保証（追加保証）","履行義務として独立販売価格の比で取引価格を配分し、配分額を契約負債に計上"],["追加保証による保証サービスは、保証期間にわたり継続的に提供される","保証期間の月数で按分し、経過した月数分を契約負債から売上に振り替える"],["使用されると見込むポイント総数","累計使用ポイント÷その年度の見込総数で累計の売上を出し、前年度までの売上を引く"]],"steps":[["履行義務を分ける","本体と、追加保証またはポイントに分ける。基本保証は分けない"],["取引価格を配分する","独立販売価格の比で按分し、本体の分は引き渡した時に売上"],["残りは契約負債","追加保証・ポイントへの配分額は、まだ履行していないので契約負債"],["履行につれて売上へ","追加保証は経過月数÷保証月数（この問題では販売日から継続提供）、ポイントは累計使用÷見込総数"],["基本保証は引当金","決算で見積額を製品保証引当金繰入額／製品保証引当金に計上"]],"why":"追加保証とポイントは販売時にまだ引き渡していない義務なので、配分額を契約負債に残し、履行につれて売上にする","check":"ポイントの例では 46,296＋3,704＝50,000、1,852＋1,029＋823＝3,704","trap":["基本保証にも取引価格を配分する ―― 正しくは配分せず、見積った費用を引当金に計上する","見込総数が変わったら前年度の売上を直す ―― 正しくは変更後の総数で累計を出し、既に認識した額を引く","ポイントの例で付与した5,000ポイントで按分する ―― 正しくは見積った独立販売価格4,000円で按分する"],"skip":["追加保証が購入日から提供される保証の例での基本保証の期間 ―― 使わない（基本保証の終了から始まる延長保証なら使う）","ポイントの例の×3年度の割合計算 ―― 累計4,500÷見込総数4,500で全部なので、差額823と同じ答え"]}]}},{"id":"r24-4","no":"財計24-4","title":"本人と代理人・変動対価 ― 例題5〜8（消化仕入・リベート・返品権付き販売）","sub":"商会","ch":24,"probs":["商会24-3","商会24-4"],"w":0.468,"wt":["収益認識（返金負債・工事進行基準に近い進捗度計算）が手つかず"],"hl":"[本人]か/[代理人]か","acct":"商会","core":{"t":"代理人は、手数料だけを収益にするのだ。リベートや返品の見込み分は売上にしないで返金負債に、返品分の原価は返品資産にするのだ。","ab":[],"parts":[{"h":null,"judge":[["顧客に商品を提供する主たる責任はＡ社が有しており","主たる責任が無いのだ。在庫リスク・価格の裁量権と合わせて、本人か代理人かを判定するのだ。"],["当社には在庫リスクや販売価格の裁量権もない","本人に当たる指標が無いのだ。だから代理人として、純額で収益を認識するのだ。"],["個数が3,000個に達した場合は１個当たり500円…のリベート","予測個数で段を決めて、見込み額を売上から除いて返金負債にするのだ。"],["製品20個が返品されると合理的に予想した","返品見込み分の売価を返金負債に、原価を返品資産にするのだ。売上高と売上原価からは除くのだ。"]],"steps":[["本人か代理人か","主たる責任・在庫リスク・価格の裁量権を見るのだ。無ければ代理人で、手数料（純額）なのだ。"],["変動対価を見積る","リベートは予測個数で段を決めるのだ。返品は返品見込み（個数や割合）を出すのだ。"],["売上を減らす","見込み額を売上高から除いて、返金負債に計上するのだ。"],["原価側を分ける（返品）","返品見込み分の原価を返品資産に、残りを売上原価にするのだ。"],["見積りが変わったら","累計の見込み額から計上済みを引いた差額を、変わった期の売上高で調整するのだ。"],["結果が出たら","返品分は、返金負債を現金に、返品資産を棚卸資産にするのだ。売れた分は売上高と売上原価へ回すのだ。"]],"why":"返金が見込まれる部分は、企業が権利を得ると見込む対価に入らないのだ。だから、そもそも収益として認識されないのだ。","check":"返品資産 ＝ 返金負債 × 原価率、売上原価 ＝ 返品見込みを除いた売上高 × 原価率 になっているかを見るのだ。","trap":["返金負債も履行義務の充足で収益に振り替わる、と考えるのはダメなのだ。返金で消えて、返金しないと確定した分だけが売上高へ行くのだ。","返品資産を売価で計上するのもダメなのだ。原価（返品見込み個数 × 原価）で計上するのだ。","代理人なのに商品代金の総額を売上高にするのもダメなのだ。報酬・手数料（純額）だけなのだ。勘定科目は問題の指示に従うのだ。"],"skip":["リベートの段を決める年間予測個数は、掛け算に使わないのだ。段を決めるだけで、金額は実際に販売した個数で出すのだ。","消化仕入の原価率は、仕訳に出ないのだ。仕入先への買掛金が与えられれば、販売代金との差額で手数料が決まるのだ。","最頻値法と期待値法の選び分けは、気にしなくていいのだ。1級テキストの変動対価の節に無く、1級の過去問・問題集の検索でも0件なのだ。"]}]},"zun":true,"video":{"blob":"5fe32a6256854345c28c2ca607ea692b","secs":544.54,"mb":6.7},"scenes":[[0.0,"この講義で学ぶこと"],[26.36,"例題5：楽天の義務は仲介"],[51.8,"例題5：総額か純額か"],[77.01,"本人か代理人か：3つの指標"],[104.76,"百貨店とティファニー"],[132.2,"例題6：消化仕入とは"],[160.3,"例題6：手数料収入は差額300"],[191.8,"ここまでの振り返り"],[215.09,"ステップ3：変動対価"],[239.19,"例題7：リベートとは"],[258.64,"例題7：第1四半期は500円の段"],[280.03,"例題7：売上は6,300,000円"],[301.4,"返金負債と契約負債は別物"],[326.67,"第2四半期：リベートが1,000円の段に"],[358.34,"第2四半期の仕訳"],[382.37,"例題8：返品権付き販売"],[399.3,"売上19,000円と返金負債1,000円"],[427.57,"返品資産と棚卸資産の違い"],[455.47,"結果が出たら：16個返品、4個は売れた"],[483.9,"変動対価の見積り方"],[505.03,"164回の問題とのつながり"]],"script":[[["ずんだもん","今回は、講義財計24-4の、本人と代理人・変動対価を解説するのだ。"],["ずんだもん","収益認識の5つのステップのうち、ステップ2とステップ3の続きなのだ。"],["めたん","例題は5から8まで。164回の商業簿記で落とした、返品権付き販売も入ってるのね。"],["ずんだもん","そうなのだ。前半が本人と代理人、後半が変動対価のリベートと返品権付き販売なのだ。"],["めたん","どれも、売上をいくらにするか、の話ってことね。"],["ずんだもん","その通りなのだ。講義のたとえを使いながら、売上の額が変わる3つの場面を順に見ていくのだ。"]],[["ずんだもん","まず例題5なのだ。楽天やアマゾンのような、ネットの通販サイトを思い浮かべるのだ。"],["めたん","ネットの店で、10万円のお酒を買った、って場面ね。"],["ずんだもん","そうなのだ。主人公は楽天なのだ。楽天の義務は、お酒を届けることではないのだ。"],["めたん","お酒を売ってるのは、出店してる酒屋さんだものね。"],["ずんだもん","その通りなのだ。楽天の義務は、お客さんと酒屋さんを結びつける、仲介なのだ。"],["ずんだもん","だから楽天が受け取れるのは、10万円のうち5パーセントの手数料なのだ。"],["めたん","100,000×5％で、5,000円。"]],[["ずんだもん","本人なら10万円、代理人なら5,000円。ここが今日の一番の分かれ目なのだ。"],["めたん","楽天は代理人だから、5,000円だけが収益ってことね。"],["ずんだもん","そうなのだ。10万円を総額、5,000円を純額と呼ぶのだ。"],["めたん","勘定科目は、売上でいいの？"],["ずんだもん","仲介の手数料なので、手数料収入なのだ。"],["ずんだもん","クレジットカードで払うので、借方は売掛金なのだ。"],["めたん","借方が売掛金5,000、貸方が手数料収入5,000ね。"],["ずんだもん","完璧なのだ。本人か代理人かで、売上の額がまるで変わるのだ。"]],[["めたん","じゃあ、本人か代理人かは、どうやって決めるのかしら。"],["ずんだもん","3つの指標で見るのだ。1つ目は、約束を果たす主な責任があるか、なのだ。"],["ずんだもん","買ったお酒がまずかったら、楽天が謝ってくれるか、を考えるのだ。"],["めたん","謝ってくれないわね。品質は酒屋さんの責任だもの。"],["ずんだもん","だから代理人ポイント1つ目なのだ。2つ目は、在庫リスクがあるか、なのだ。"],["めたん","売れ残っても、楽天が買い取るわけじゃないわ。"],["ずんだもん","代理人ポイント2つ目なのだ。3つ目は、値段を決められるか、なのだ。"],["めたん","値段を決めてるのは酒屋さん。3つとも無いから、楽天は代理人ね。"]],[["ずんだもん","百貨店でも同じなのだ。百貨店の中にある、ティファニーの店を考えるのだ。"],["めたん","宝石に傷があっても、百貨店は責任を持たないし、売れ残りも買い取らない。"],["ずんだもん","そうなのだ。値段の決め方の例が面白いのだ。"],["ずんだもん","百貨店が10パーセントセールの日も、中のティファニーは値引きしていないのだ。"],["めたん","百貨店には、値段を決める力がないって証拠ね。"],["ずんだもん","3ポイントそろって、百貨店も代理人なのだ。"],["ずんだもん","この基準ができてから、百貨店は売上が純額になって、見た目の売上が大きく下がったのだ。"],["めたん","売上の数字が、急に何分の一にもなったわけね。"]],[["ずんだもん","例題6は、その百貨店の話なのだ。消化仕入、という百貨店の言葉が出てくるのだ。"],["めたん","消化って、食べ物みたいね。"],["ずんだもん","お客さんが宝石を買ってくれることを、消化と言うのだ。"],["ずんだもん","売れるたびに、百貨店がティファニーから仕入れて、お客さんに売る、と考えるのだ。"],["めたん","売れた瞬間に、仕入れと売上が同時に起きるのね。"],["ずんだもん","そうなのだ。まず、本人か代理人かを判定するのだ。"],["めたん","資料には、納品の時に検収しない、所有権もリスクも仕入先、値段を決めるのも仕入先、ってあるわ。"],["ずんだもん","3つとも百貨店には無いのだ。だから代理人なのだ。"]],[["ずんだもん","数字を見るのだ。宝石が売れるたびに、1,200円で仕入れて、1,500円で売っているのだ。"],["めたん","1,200÷1,500で、80パーセント。原価率みたいなものね。"],["ずんだもん","百貨店では、これを料率と言うのだ。でも仕訳には出てこないので、気にしなくていいのだ。"],["めたん","代理人だから、売上は1,500円じゃないのよね。"],["ずんだもん","その通りなのだ。1,500−1,200で、差額の300円だけが手数料収入なのだ。"],["ずんだもん","借方は、お客さんからの現金預金1,500なのだ。"],["めたん","貸方は、仕入先への買掛金1,200と、手数料収入300ね。"],["ずんだもん","完璧なのだ。現金と買掛金が同時に出て、その差額が収益になるのだ。"]],[["ずんだもん","ここで、いったん振り返るのだ。"],["ずんだもん","下書きは、左に権利、右に義務を書く形なのだ。"],["めたん","例題3から6は、どっち側の話だったかしら。"],["ずんだもん","右側、つまり義務の話なのだ。ステップ2の、履行義務を分ける話なのだ。"],["ずんだもん","例題3は保証、例題4はポイント、例題5と6は仲介の義務だけを純額で認める話だったのだ。"],["めたん","どれも、何を約束したか、を見てたのね。"],["ずんだもん","そうなのだ。ここからは左側、対価の話に移るのだ。"]],[["ずんだもん","ステップ3は、取引価格、つまりいくらもらえるか、なのだ。"],["ずんだもん","取引価格を出すときは、4つを考えるのだ。変動対価、重要な金融要素、現金以外の対価、顧客に支払われる対価なのだ。"],["めたん","今日やるのは、1つ目の変動対価ね。"],["ずんだもん","そうなのだ。約束した金額のうち、後で変わるかもしれない部分なのだ。"],["ずんだもん","値引き、リベート、返金、返品権付きの販売などが入るのだ。"],["めたん","例題になってるのは、リベートと返品権付き販売の2つね。"]],[["ずんだもん","例題7はリベートなのだ。ビール会社とスーパーにたとえるのだ。"],["ずんだもん","ビール会社は、スーパーがたくさん売ってくれると嬉しいのだ。"],["めたん","だから、たくさん売ってくれたら値段をおまけする、ってことね。"],["ずんだもん","その通りなのだ。1年に3,000個売れたら1個500円、10,000個なら1個1,000円、値下げするのだ。"],["めたん","頑張ったごほうびに、あとでお金を返すのね。"],["ずんだもん","そうなのだ。これをリベートと言うのだ。"]],[["ずんだもん","第1四半期に、1個5,000円のビールを1,400個売ったのだ。"],["めたん","1年は4つの四半期だから、1,400×4でも5,600個。10,000個には届かないわ。"],["ずんだもん","そうなのだ。資料でも、年間の見込みは6,000個なのだ。"],["めたん","3,000個は超えるから、リベートは1個500円の段ね。"],["ずんだもん","完璧なのだ。6,000個は段を決めるのに使うだけで、掛け算には使わないのだ。"],["めたん","受け取る代金は、5,000×1,400で、7,000,000円。"]],[["ずんだもん","このうち、リベートで返しそうな分は、売上にしないのだ。"],["めたん","500×1,400で、700,000円ね。"],["ずんだもん","そうなのだ。売上高は、7,000,000−700,000で、6,300,000円なのだ。"],["ずんだもん","問題文には代金の受け方が書いていないので、現金で売ったと補うのだ。"],["めたん","借方は現金預金7,000,000。貸方は売上高6,300,000と……残りの700,000は何かしら。"],["ずんだもん","それが、返金負債なのだ。"]],[["めたん","返金負債って、前に出てきた契約負債と同じようなもの？"],["ずんだもん","全然違うのだ。ここは混ぜないでほしいのだ。"],["ずんだもん","契約負債は、約束を果たすと、取り崩して収益に変わるのだ。"],["ずんだもん","返金負債は、スーパーに返すかもしれないお金なのだ。取り崩すと、現金が出ていくだけなのだ。"],["めたん","収益にはならないのね。"],["ずんだもん","そうなのだ。返金負債が取り崩されて収益に変わることは、ないのだ。"],["ずんだもん","ただしテキストでは、返さないと決まった分は、売上高に振り替えるのだ。例題8の最後で出てくるのだ。"]],[["ずんだもん","ここからは、講義で数字を仮定した続きなのだ。問題集には無い数字なのだ。"],["ずんだもん","第2四半期に4,000個売れて、半年で5,400個になったのだ。"],["めたん","このペースなら、1年で10,000個に届きそうね。"],["ずんだもん","そうなのだ。リベートは1個1,000円の段になるのだ。"],["めたん","じゃあ、第2四半期の4,000個に1,000円をかければいいのね。"],["ずんだもん","それだけでは足りないのだ。第1四半期の1,400個も、1,000円の段になったのだ。"],["ずんだもん","累計の5,400個×1,000円で、5,400,000円なのだ。"],["めたん","第1四半期に700,000円は計上済みだから、5,400,000−700,000で、4,700,000円。"],["ずんだもん","完璧なのだ。これが第2四半期に積む返金負債なのだ。"]],[["めたん","第2四半期の代金は、5,000×4,000で、20,000,000円ね。"],["ずんだもん","そうなのだ。売上高は、20,000,000−4,700,000で、15,300,000円なのだ。"],["めたん","借方は現金預金20,000,000。貸方は売上高15,300,000と、返金負債4,700,000。"],["ずんだもん","その通りなのだ。"],["めたん","第1四半期の売上は、直さないの？"],["ずんだもん","直さないのだ。見込みが変わった期で、差額をまとめて調整するのだ。"],["ずんだもん","テキストでは、これを取引価格の事後的な変動、と呼んでいるのだ。"]],[["ずんだもん","例題8は、返品権付き販売なのだ。テレビショッピングをイメージするのだ。"],["めたん","とりあえず買って、気に入らなかったら返品できる、ってやつね。"],["ずんだもん","そうなのだ。1個50円の製品を400個、20,000円で売ったのだ。"],["ずんだもん","そのうち20個は、返品されると予想しているのだ。"],["めたん","返ってきそうな分を、売上にしていいかが問題ね。"]],[["ずんだもん","返ってくる可能性のあるものは、売上にしてはダメなのだ。"],["めたん","20×50で、1,000円は売上から外すのね。"],["ずんだもん","そうなのだ。売上高は、(400−20)×50で、19,000円なのだ。"],["めたん","代金の20,000円は受け取ってるから、差の1,000円が返金負債ね。"],["ずんだもん","その通りなのだ。返品されたら、その分のお金を返すからなのだ。"],["ずんだもん","次は原価なのだ。原価は1個30円なので、30÷50で原価率は60パーセントなのだ。"],["めたん","売上原価は、(400−20)×30で、11,400円。売上の60パーセントね。"]],[["めたん","残りの20個分の原価は、どうするの？"],["ずんだもん","20×30で600円を、返品資産にするのだ。"],["めたん","返金負債1,000円の60パーセントね。"],["ずんだもん","そうなのだ。返金負債は売価、返品資産は原価で測るのだ。"],["めたん","でも、棚卸資産のままじゃダメなのかしら。"],["ずんだもん","棚卸資産は自分の所にある物、返品資産は相手の所にある物なのだ。"],["ずんだもん","お客さんの手元にあるけど、まだ売れたとは言えない物なのだ。状況が違うので、勘定を分けるのだ。"],["めたん","仕訳は、借方が売上原価11,400と返品資産600、貸方が棚卸資産12,000ね。"]],[["ずんだもん","その後、20個のうち16個が返品されて、4個は買ってもらえたのだ。"],["めたん","返品された16個は、お金を返すのね。16×50で800円。"],["ずんだもん","そうなのだ。返金負債800で、現金預金800を返すのだ。"],["ずんだもん","返ってきた製品は、16×30の480円を、返品資産から棚卸資産に戻すのだ。"],["めたん","売れた4個は、今度こそ売上ね。"],["ずんだもん","その通りなのだ。4×50の200円を、返金負債から売上高に振り替えるのだ。"],["ずんだもん","原価は4×30の120円を、返品資産から売上原価に振り替えるのだ。"]],[["ずんだもん","最後に、変動対価をどう見積もるか、なのだ。"],["ずんだもん","最頻値法と期待値法の、2つのやり方があるのだ。"],["めたん","一番起こりそうな1つを選ぶか、確率で平均するか、ね。"],["ずんだもん","そうなのだ。結果が2つしかないなら最頻値法、いろいろなパターンがあるなら期待値法が合う、とされているのだ。"],["めたん","試験では、自分で選ぶの？"],["ずんだもん","計算問題では、どちらを使うか指示がつくのだ。自分で選ぶことはまずないのだ。"]],[["ずんだもん","最後に、164回の商業簿記とのつながりなのだ。"],["めたん","返品権付き販売が出て、本人は空欄だったのよね。"],["ずんだもん","そうなのだ。考え方は例題8と同じなのだ。返品を見込む分は売上にせず、返金負債にするのだ。"],["ずんだもん","164回は、返品の見込みが10,000、原価率が80パーセントだったのだ。"],["めたん","返品資産は、10,000×80％で、8,000ね。"],["ずんだもん","その通りなのだ。違うのは、164回は三分法で帳簿をつけていたことなのだ。"],["ずんだもん","三分法では、返品資産は、借方が返品資産、貸方が売上原価、の形で計上するのだ。"],["めたん","例題8は棚卸資産から振り替えたけど、164回は売上原価から外すのね。"],["ずんだもん","そうなのだ。返金負債は売価、返品資産は原価。これを覚えておけば、どちらの形でも解けるのだ。"]]],"shorts":[{"hl":"本人か代理人かは/[3つ]で決める","at":77.01,"blob":"10e6ca4bb9b690a09e6ee2dc5ef18548"},{"hl":"寸劇：本人か代理人かは/[3つ]で決める","at":77.01,"blob":"7a0d4017b2ede32afb9d1aa660c12701"},{"hl":"リベートの分は/[返金負債]","at":239.19,"blob":"be643fd0696d1e0c57cd3147c005f643"},{"hl":"寸劇：リベートの分は/[返金負債]","at":239.19,"blob":"2867b700a09c53b359ef5af573eb52e1"},{"hl":"返金負債は[売価]/返品資産は[原価]","at":382.37,"blob":"c5393a03c8cf9c97ad26d75876abec4e"},{"hl":"寸劇：返金負債は[売価]/返品資産は[原価]","at":382.37,"blob":"f360dc2a944401db3baa62885d3ea26e"}]},{"id":"r24-5","no":"財計24-5","title":"取引価格の算定と配分 ― 金融要素・顧客に支払われる対価・値引きの配分（例題9〜16）","sub":"商会","ch":24,"probs":["商会24-7"],"w":0.468,"wt":["収益認識（返金負債・工事進行基準に近い進捗度計算）が手つかず"],"hl":"","acct":"商会","core":{"t":"取引価格は金利・顧客への支払・第三者の分を調整して決め、値引きは原則すべての履行義務に比例配分する","ab":[],"parts":[{"h":null,"judge":[["契約に重要な金融要素（金利相当分）が含まれている","売上は現金販売価格。金利相当分は回収までの期間の受取利息"],["顧客に返金不要の支払を行う（棚の変更の補償）","取引価格から減額。この例題では支払時に前払金、販売のつど取り崩して売上を減らす"],["売上に係る消費税等／X社ポイントを付与（支配していない）","第三者のために回収する額。売上に入れず仮受消費税等・未払金"],["通常、製品X及びZをセットにして56円で販売している","束の値引き24円が契約全体の値引きと同額で証拠になるので、XとZだけに配分。Yはそのまま"],["1,000個を超えると見積り、価格を遡及的に減額","既に販売した分の減額も変動した期の売上で修正し、単価差×累計数量を返金負債に"]],"steps":[["金融要素を分ける","現金販売価格で売掛金と売上。回収額を売掛金残高×利率の受取利息と元本に分ける"],["顧客への支払を減額","支払額を前払金に。この例題では請求額×（支払額÷購入見込額）を取り崩して売上を減らす"],["第三者の分を除く","消費税は仮受消費税等、支配していない他社ポイントは未払金。売上は残りの額"],["値引きを配分する","原則は全履行義務に独立販売価格の比。束の値引きが契約の値引きと同額で観察可能な証拠がある等、要件をすべて満たせばその束だけに"],["観察できない価格を見積る","幅広い価格帯で売る財は、取引価格から他の財の独立販売価格を引く（残余アプローチ）"],["事後的な変動を直す","累計数量×新単価－既に計上した売上が当期の売上。単価差×累計数量を返金負債"]],"why":"取引価格は企業が権利を得ると見込む対価の額で、第三者のために回収する額を除く。金利や顧客への支払はその額を調整するもの","check":"金融要素: 売上11,100・利息444/302/154。顧客への支払: 売上1,800。値引き: 40/32/24、35/40/21。変動: 売上44,250・返金負債5,750","trap":["約束した対価12,000円で売上を計上する ―― 正しくは現金販売価格11,100円、900円は受取利息","支払った1,500円を支払時に全額売上から減らす ―― この例題では前払金にして販売のつど減額","他社ポイント分を契約負債にする ―― 正しくは未払金（X社への支払義務）","遡って下げた単価の差額を契約負債にする ―― 正しくは返金負債"],"skip":["金融要素の約束した対価12,000円 ―― 仕訳には出ない。900円は受取利息444＋302＋154で全部収益になる","XとZのセットの値引きがある時のYの配分計算 ―― 値引きが0なので独立販売価格40円のまま売上になる"]}]}},{"id":"r24-6","no":"財計24-6","title":"工事契約の原価比例法 ― 見積りの変更と工事損失引当金（例題1・3・4）","sub":"商会","ch":24,"probs":["商会24-5"],"w":0.468,"wt":["収益認識（返金負債・工事進行基準に近い進捗度計算）が手つかず"],"hl":"","acct":"商会","core":{"t":"工事収益は進捗度の累計で累計額を出して前期までを引き、各期末に残りが赤字なら工事損失引当金を積む","ab":[],"parts":[{"h":null,"judge":[["進捗度は，コストに基づくインプット法(原価比例法)による","当期末までの実際工事原価の累計÷見積工事原価で進捗度を出し、請負金額に掛けて累計の工事収益を出す"],["請負金額が〇円に，見積工事原価が〇円に変更された","変更した期から変更後の金額で累計を出し直す。前期までに計上した工事収益は修正しない"],["第３期に建物が完成し，Ａ社へ引渡した","完成年度は進捗度を出さず、請負金額から前期までの工事収益を引いた残りを収益にする"],["見積工事原価が〇円に変更された（変更後が請負金額を上回る）","各期末に残りの収益と残りの原価を比べ、原価が上回る額を工事損失引当金の残高にする"]],"steps":[["線分を描く","3期に分け、線の上に請負金額、線の下に見積工事原価と各期の実際工事原価を書く"],["累計の進捗度を出す","当期末までの実際工事原価の累計÷見積工事原価（変更があれば変更後の金額）"],["当期の工事収益を出す","請負金額×累計の進捗度から前期までの工事収益を引く。完成年度は請負金額の残り"],["期末に残りを比べる","残りの原価が残りの収益を上回れば、その額を工事損失引当金にし、繰入を売上原価 -4","title":"子会社の配当","sub":"商会","ch":26,"probs":["商会26-1"],"w":0.468,"wt":["連結の数字で「非支配株主の分を含むか」を取り違える"],"hl":"配当は/[2つ]に割る","acct":"商会","core":{"t":"子会社の配当は全額取り消し、親会社分は受取配当金と相殺、非支配株主分は非支配株主持分の減少。P/Lを通らないので按分とは別","ab":[],"parts":[{"h":null,"judge":[["「Ｓ社は当期中に利益剰余金を財源とする…配当を行っている」","（貸）利益剰余金－剰余金の配当（全額）／（借）受取配当金（×親会社比率）・非支配株主持分－当期変動額（×非持比率）"],["Ｐ社の損益計算書に「受取利息配当金」が1本で載る","子会社からの配当×親会社比率だけを抜いて相殺する。子会社以外からの配当は残す"],["「Ｐ社は当期中に…配当を行っている」","親会社の配当は消さない。連結S/Sの剰余金の配当は親会社の分だけ"],["子会社の土地の時価が、決算日ごとに違う額で並ぶ","使うのは支配獲得日の時価だけ。評価差額は支配獲得日の額のまま動かさない"]],"steps":[["当期の利益剰余金を2段に書く","当期純利益と配当を分けて、それぞれ矢印の上下に。前期以前は純額でよい"],["開始仕訳を当期首の列から","前期までの相殺・按分・のれん償却をまとめて1本。当期首の資本合計×非持比率とのれん残高を取る"],["配当を取り消して割り振る","貸方で子会社の配当を全額取り消し、借方は親会社比率分を受取配当金、非持比率分を非支配株主持分－当期変動額"],["非支配株主持分は差額で","期首と期末の資本合計×非持比率の差が変動額。非支配株主に帰属する当期純利益とは配当の分だけずれる"],["利益剰余金は取り込む分を足す","親会社の期末＋各期の（矢印の上－親会社が受けた配当－のれん償却）の累積"]],"why":"配当は子会社の純資産を減らすだけで当期純利益は動かない。だから非支配株主分はP/Lではなく持分の減少で落とす","check":"期末の利益剰余金を、単純合算に調整を当てる道と、取り込む分の累積を足す道で出して一致する","trap":["非支配株主への配当を「非支配株主に帰属する当期純利益」で落とす ―― 配当はP/Lを通らない","親会社比率分だけ配当を取り消す ―― 子会社が払った配当は全額取り消す","親会社の受取配当金を全額消す ―― 消すのは子会社からの分だけ"],"skip":["前期以前の配当は当期純利益と純額にして按分してよい（開始仕訳の科目が変わらないから）"]}]}},{"id":"f26-2","no":"財計27-1","title":"段階取得","sub":"商会","ch":27,"probs":["商会26-2"],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"支配獲得前に持っていた株も支配獲得日の時価に引き直す。差額は段階取得に係る差益（特別利益）、のれんは引き直した投資額から出す","ab":[],"parts":[{"h":null,"judge":[["先に一部を取得し、後の取得で「支配を獲得した」","段階取得。支配獲得日の取得価額÷その日の取得比率×合計の比率で投資額を引き直す。個別の取得原価合計との差が段階取得に係る差益"],["土地の時価が、先の取得日と支配獲得日の2つ並ぶ","支配獲得日の時価だけを使う（全面時価評価法）。まだ支配していない日の時価は使わない"],["当期の末日に「支配を獲得した」","当期の間はまだ他人。Ｓ社のP/L・S/Sは合算せず、B/Sだけ合算する"],["連結P/Lに「段階取得に係る差益」の欄","売却益の性質なので特別利益。連結の利益剰余金にも足す"]],"steps":[["タイムテーブルは支配獲得日から","一部だけの段階はその他有価証券なので書かない。合計の比率になった日を左端に、評価差額はその日の時価で"],["投資額をその日の時価に揃える","支配獲得日の取得価額÷その日の取得比率×合計の比率＝支配獲得日の時価"],["段階取得に係る差益を計上する","（借）子会社株式／（貸）段階取得に係る差益。金額は支配獲得日の時価－個別の取得原価合計"],["揃えた投資額で相殺する","のれん＝支配獲得日の時価－資本合計×親会社比率。非支配株主持分は資本合計×非持比率"],["翌期は開始仕訳で戻す","差益は利益剰余金－当期首残高に姿を変え、子会社株式は個別の取得原価合計に戻る"]],"why":"先に持っていた株は、支配を得た瞬間に紙切れからゴールデンチケットに変わる。いったん時価で売って買い戻したと考えるので、差は売却益","check":"段階取得に係る差益は、全体（支配獲得日の時価－取得原価合計）でも、先の分だけ（時価に引き直した額－その取得原価）でも同じ額","trap":["取得原価を単純に足して相殺する ―― 違う日の株価なので、支配獲得日の時価に揃える","連結の利益剰余金に段階取得に係る差益を足し忘れる","支配獲得日が期末なのにＳ社のP/Lまで合算する"],"skip":["売って買い戻す2本の仕訳は書かなくてよい。残る1本（子会社株式／段階取得に係る差益）で足りる"]}]}},{"id":"f26-3","no":"財計27-2","title":"追加取得","sub":"商会","ch":27,"probs":["商会26-3"],"w":0.0,"wt":[],"hl":"差額は/[資本剰余金]","acct":"商会","core":{"t":"支配獲得後の買い増しは非支配株主との資本取引。持分と投資額の差はのれんにせず資本剰余金、以後は新しい比率で按分する","ab":[["支配獲得まで（第三者から）","損益取引。差額はのれん（負ののれん発生益）"],["支配獲得後（非支配株主から）","資本取引。差額は資本剰余金。のれんは増えない"]],"parts":[{"h":null,"judge":[["支配獲得の後に「発行済株式総数の20％を…取得」","追加取得。（借）非支配株主持分（その日の資本合計×追加比率）／（貸）子会社株式（払った額）、差額は資本剰余金"],["追加取得の持分より高い額で買った","差額は借方の資本剰余金（純資産のマイナス）。安く買えば貸方。向きはタイムテーブルの持分と投資額で決める"],["追加取得が前期末（当期首より前）","追加取得の仕訳も開始仕訳に入る。資本剰余金－当期首残高に差額を足し引きし、非支配株主持分は追加取得後の比率で"],["「追加取得後の子会社利益は、追加取得後の持分比率に基づき按分」","追加取得の後の利益は新しい非持比率で按分する"]],"steps":[["支配獲得日を片付ける","評価差額を計上し、資本合計×親会社比率と子会社株式を相殺してのれん。評価差額は支配獲得日の1回きり"],["追加取得の欄に持分を書く","追加取得日の資本合計×追加比率。その下に払った額を並べ、どちらが大きいかで差額の向きを決める"],["追加取得の仕訳を切る","（借）非支配株主持分／（貸）子会社株式（開始仕訳で消えずに残った分をゼロに）。差額は資本剰余金"],["按分比率を切り替える","追加取得の後の子会社の利益は、追加取得後の非持比率で按分する"],["B/Sの資本剰余金を直す","親会社の資本剰余金±追加取得の差額。翌期の開始仕訳の資本剰余金にも入れる"]],"why":"支配した後の非支配株主は同じグループの身内。身内との取引からのれんを出して償却すると将来のP/Lが動くので、差額は純資産にとどめる","check":"子会社株式が開始仕訳と追加取得の仕訳でゼロになる。非支配株主持分＝期末の資本合計×追加取得後の非持比率","trap":["追加取得の差額をのれんにする ―― 資本取引なので資本剰余金","資本剰余金をいつも貸方に出す ―― 高く買えば借方（純資産マイナス）","追加取得の後も元の非持比率で按分する"],"skip":["支配獲得日より後の決算日の土地の時価は使わない（評価差額は支配獲得日の額のまま）"]}]}},{"id":"f27-1","no":"財計27-3","title":"一部売却","sub":"商会","ch":27,"probs":["商会26-4"],"w":0.0,"wt":[],"hl":"[王冠の絵]で/一発","acct":"商会","core":{"t":"一部売却は、親会社と非支配株主のあいだの資本取引なのだ。だから個別で出た売却益は消して、連簿価との差額を資本剰余金にするのだ。","ab":[["個簿価","取得原価÷売却前の持分比率×売却割合なのだ。子会社株式を減らす額なのだ。"],["連簿価","売却したときの子会社の資本合計×売却割合なのだ。非支配株主持分へ振り替える額なのだ。"]],"parts":[{"h":null,"judge":[["「Ｓ社株式の10％を…で売却した」とあって、売却後も支配が続く","一部売却なのだ。売却価額と連簿価の差額は、損益じゃなくて資本剰余金なのだ。"],["個別の損益計算書に「Ｓ社株式売却益」がある","連結修正仕訳で全部取り消すのだ。連結損益計算書の売却益はゼロなのだ。"],["連結貸借対照表の非支配株主持分を答える","売却後の比率×期末の子会社資本合計なのだ。売却前の比率のままにしないのだ。"],["期末に売った年の「非支配株主に帰属する当期純利益」","売却前の比率で割るのだ。その年の利益は、売る前の持分で稼いだものだからなのだ。"]],"steps":[["個別上の仕訳を書く","売却価額と個簿価の差が、個別の売却損益なのだ。"],["連結上あるべき仕訳を書く","連簿価を非支配株主持分へ回して、売却価額との差額が資本剰余金なのだ。"],["差を連結修正仕訳にする","売却損益を消し、個簿価で子会社株式を戻し、連簿価で非支配株主持分を増やすのだ。残りが資本剰余金なのだ。"],["連結財務諸表に書く","資本剰余金は親会社の個別額に差額を加減し、利益剰余金からは取り消した売却損益を除くのだ。非支配株主持分は売却後の比率なのだ。"]],"why":"親会社と非支配株主は、どちらも資本の持ち主なのだ。持ち主どうしの売り買いで損益は出ないから、差額は資本剰余金に入るのだ。","check":"連結の利益剰余金は、タイム・テーブルから拾っても、単純合算から仕訳を引いても、同じ額になるのだ。","trap":["個別で益が出たから、連結の資本剰余金も貸方だと決めつけるのはダメなのだ。比べる相手は連簿価で、売却価額が下回れば借方なのだ。","売却持分を、支配獲得日の資本合計で出すのもダメなのだ。売ったときの資本合計に、売却割合を掛けるのだ。","連結の利益剰余金で、取り消した売却益を引き忘れやすいのだ。引かないと、単純合算に残ったままになるのだ。"],"skip":["資本剰余金から法人税等相当額を控除する仕訳は、連結税効果を習ってからでいいのだ。","一部売却の仕訳で、連結損益計算書の収益・費用は動かないのだ。動くのは売却益の取消だけなのだ。"]}]},"zun":true,"video":{"blob":"9e4ecbbd6dd63a48b37aa3037e077171","secs":702.66,"mb":8.4},"scenes":[[0.0,"この講義で学ぶこと"],[24.68,"一部売却は追加取得の逆 ― 80％持っていた株を20％売る"],[48.09,"個別上の仕訳 ― 45,000の4分の1を15,000で売って売却益3,750"],[84.04,"連結上は売却益がおかしい ― 子会社株式という科目が使えない"],[112.26,"子会社株式の代わりに非支配株主持分 ― 11,250と13,600で金額が違う"],[144.88,"連簿価＝子会社の純資産×売却割合 ― 個簿価と連簿価は超大事な概念"],[177.55,"連結修正仕訳は一発で切る ― 王冠の絵を描く"],[200.03,"王冠の絵の読み方 ― 売却益3,750から資本剰余金1,400へ"],[227.5,"個簿価を消して連簿価で認識 ― タイム・テーブルへ写す"],[255.13,"タイム・テーブルに売却価額と売却益を書き足す"],[280.77,"黄色の線で貸借を読む ― 差額1,400は貸方に出る"],[307.11,"当期の仕訳は4本 ― 新しいのは一部売却だけ"],[342.63,"連結損益計算書 ― 動くのは売却益が消えることだけ"],[360.9,"売却益は必ずゼロ ― 連結貸借対照表を作る"],[389.22,"非支配株主持分は売却後の40％ ― 利益剰余金はタイム・テーブルから"],[417.83,"利益剰余金は売却益の取消も忘れない ― 60,300"],[439.5,"仕訳から集計しても同じ ― 単純合算から4か所を引く"],[467.7,"例題4 ― 違いは売却価額が12,000になっただけ"],[483.73,"個別益は750、連簿価は13,600 ― 資本剰余金は借方に1,600"],[510.86,"例題4の連結修正仕訳 ― 売却益を消して資本剰余金を借方へ"],[532.41,"例題4のタイム・テーブル ― 売却益△750を書く"],[549.05,"符号を間違えない ― 13,600のものを12,000で売れば損サイド"],[571.77,"例題4の連結財務諸表 ― 資本剰余金は10,000－1,600＝8,400"],[590.78,"例題4の利益剰余金 ― △750を忘れがち"],[612.69,"例題5の予告 ― 資本剰余金から法人税等相当額を控除する"],[636.16,"この仕訳は捨てておいてよい ― 次は成果連結"],[657.06,"164回の問題とのつながり"]],"script":[[["ずんだもん","今回は、講義財計27-3の、一部売却を解説するのだ。"],["めたん","前回は追加取得だったわね。"],["ずんだもん","そうなのだ。追加取得の逆で、今回は持っている株式を売っていくのだ。"],["めたん","どちらも非支配株主との資本取引、ってことね。"],["ずんだもん","そうなのだ。追加取得は非支配株主持分を借方で減らす、一部売却は貸方で増やすのだ。"],["めたん","164回の会計学で、時間切れになったところよね。"],["ずんだもん","そうなのだ。今日は「王冠の絵」で、資本剰余金を一発で出せるようになるのだ。"]],[["ずんだもん","例題3を見るのだ。Ｐ社はＳ社株式を80％持っていて、そのうち20％を売るのだ。"],["めたん","まずＰ社がＳ社を80％持っている図を描くのね。"],["ずんだもん","そうなのだ。この80％を買ったのは、赤の他人からなのだ。"],["めたん","赤の他人からの取得だから、損益取引ね。"],["ずんだもん","そうなのだ。でも20％を売る相手は、非支配株主なのだ。"],["めたん","非支配株主とは親戚みたいなもの…だから、この20％の売却は資本取引ってことね。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","損益取引からは損益計算書に効く損益が出て、資本取引からは損益が出ないのだ。"],["めたん","資本取引で差額が出たら、資本剰余金にするのね。追加取得と同じだわ。"],["ずんだもん","そうなのだ。まずは連結ではなく、個別上の仕訳から見るのだ。"],["めたん","普通の株式の売却よね。取得原価45,000のうち、4分の1を売ったのよね。"],["ずんだもん","そうなのだ。売却原価は、取得原価45,000÷80％×20％なのだ。"],["めたん","45,000÷80×20で、11,250ね。"],["ずんだもん","その11,250の価値のものを、15,000で売ったのだ。"],["めたん","借方が現金預金15,000で、貸方は子会社株式11,250と…差額は？"],["ずんだもん","差額の3,750が、子会社株式売却益なのだ。"]],[["めたん","この3,750、Ｐ社の個別の損益計算書にちゃんと乗ってるじゃない。"],["ずんだもん","そこが問題なのだ。連結上は資本取引だから、売却益が出てるのはおかしいのだ。"],["めたん","連結上は資本剰余金にしたい、ってことね。"],["ずんだもん","そうなのだ。つまり、この個別上の仕訳は、連結の目で見ると間違っているのだ。"],["めたん","じゃあ連結上、子会社株式は減らさないの？"],["ずんだもん","連結上に子会社株式という科目自体、出てこないのだ。"],["めたん","そっか、投資と資本の相殺消去で、もう消えてるものね。"],["ずんだもん","その通りなのだ。だから子会社株式という勘定科目は、連結上では使えないのだ。"]],[["ずんだもん","代わりに使うのが、非支配株主持分なのだ。"],["めたん","Ｐ社の持分が20％減った分、非支配株主に移った、ってことね。"],["ずんだもん","そうなのだ。だから貸方に非支配株主持分－当期変動額を持ってくるのだ。"],["めたん","でも金額が違うじゃない。子会社株式は11,250なのに、非支配株主持分は13,600よ。"],["ずんだもん","そのとおりなのだ。11,250を個別上の簿価、略して個簿価と呼ぶのだ。"],["めたん","13,600のほうは連結上の簿価、連簿価ね。"],["ずんだもん","そうなのだ。個簿価は取得原価ベース、45,000の4分の1で決まるのだ。"],["めたん","じゃあ連簿価は？"],["ずんだもん","子会社が純資産を増やせば、それに連動して上がる、実質的な価値なのだ。"]],[["めたん","13,600は、どこから出てくるの？"],["ずんだもん","タイム・テーブルの子会社純資産合計68,000に、売却割合20％をかけるのだ。"],["めたん","68,000×20％で、13,600ね。"],["ずんだもん","個簿価と連簿価、この2つは超大事な概念なのだ。"],["めたん","取得原価で見るのが個簿価、純資産連動で見るのが連簿価ってことね。"],["ずんだもん","そうなのだ。実際に売った価額はどちらで考えても15,000なのだ。"],["めたん","資本取引だから、差額は売却損益じゃなくて資本剰余金ね。"],["ずんだもん","そうなのだ。連結上あるべき仕訳は、借方現金預金15,000。"],["めたん","貸方は、非支配株主持分13,600と…差額の資本剰余金1,400ね。"],["ずんだもん","完璧なのだ。"]],[["ずんだもん","今Ｐ社は個別上で間違った仕訳を切っているので、正しい仕訳へ直す連結修正仕訳が要るのだ。"],["めたん","2本の仕訳を書いてから差を取るの、時間かかりそうね。"],["ずんだもん","試験中にそれをやっていたら時間が足りないのだ。一発で切れるようになるのだ。"],["めたん","そのための図が、王冠の絵ね。"],["ずんだもん","そうなのだ。宝石が付いた王冠のような形になるのだ。"],["めたん","何を意味してるの？"],["ずんだもん","売却価額15,000に対して、個簿価は取得原価ベースの11,250なのだ。"]],[["めたん","個別上は11,250のものを15,000で売ったから、売却益3,750が乗ってるのよね。"],["ずんだもん","そうなのだ。ところが正しくは、連簿価13,600のものを15,000で売ったと考えるのだ。"],["めたん","13,600のものを15,000で売ったら…差額は1,400ね。"],["ずんだもん","そうなのだ。連結上は資本剰余金が1,400出るのが正しい姿なのだ。"],["めたん","個別のほうが間違っていて、連結のほうが正しい、ってことね。"],["ずんだもん","その通りなのだ。絵の上では、売却益3,750を左で消して、資本剰余金1,400を右で計上し直すのだ。"]],[["ずんだもん","同じことが簿価の側でも起きているのだ。"],["めたん","個別上は個簿価11,250を消し込んでたけど、正しくは連簿価13,600を認識するのね。"],["ずんだもん","そうなのだ。非支配株主持分の増加として、13,600を立て直すのだ。"],["めたん","王冠の絵をさっと描けば、個別と連結の2本を書いて差を取らなくていいのね。"],["ずんだもん","そうなのだ。慣れてくると、この連結修正仕訳すら切らなくなるのだ。"],["めたん","タイム・テーブルの上だけで、仕訳が見えるようになる、ってこと？"],["ずんだもん","そうなのだ。個簿価11,250、連簿価13,600を、タイム・テーブルに書き込んでいくのだ。"]],[["ずんだもん","タイム・テーブルは下書きだから、自分の取りやすいようにアレンジしていいのだ。"],["めたん","講師のを丸写ししなくていいのね。"],["ずんだもん","そうなのだ。四角で囲って売却価額15,000、1行空けて売却益△3,750と書くのだ。"],["めたん","△3,750は、個別上の損益計算書に乗ってる、間違ったほうの数字ね。"],["ずんだもん","そうなのだ。正しくは売却益じゃなくて、資本剰余金1,400なのだ。"],["めたん","ここからどうやって、1,400が出るって分かるの？"],["ずんだもん","タイム・テーブルの黄色い線を、貸借の分かれ目だと考えるのだ。"]],[["めたん","黄色より左・上が借方で、右・下が貸方、だったわね。"],["ずんだもん","そうなのだ。左にある△13,600は、プラスに直すと右、つまり貸方なのだ。"],["めたん","下にある11,250と3,750にも△が付いてるわ。"],["ずんだもん","下にあって△が付いているのは、プラスに直すと左、借方なのだ。"],["めたん","借方が下、貸方が上…あれ、貸方のほうが金額が足りないじゃない。"],["ずんだもん","そうなのだ。差額として貸方に1,400出る。これが資本剰余金1,400なのだ。"],["めたん","仕訳を切らなくても、タイム・テーブルから見て取れるのね。"]],[["ずんだもん","当期の仕訳は4本切ったのだ。ＡＢＣＤ。新しいのはＤの一部売却だけなのだ。"],["めたん","ＡＢＣは、前回の追加取得と同じ話ね。"],["ずんだもん","そうなのだ。Ａは開始仕訳、利益剰余金21,050。相殺20,000に前期の按分1,000、前期ののれん償却50を足すのだ。"],["めたん","Ｂは当期利益の按分よね。"],["ずんだもん","Ｓ社の当期純利益8,000×20％で、1,600なのだ。"],["めたん","あれ、20％って売却後の比率じゃないの？もう20％売ったんでしょ。"],["ずんだもん","そこが注意点なのだ。期末に売却しているので、当期利益の按分には売却前の非支配株主持分比率を使うのだ。"],["めたん","なるほど、期首から期末までは、まだ80対20だったものね。"],["ずんだもん","そうなのだ。Ｃはのれん償却額50なのだ。"]],[["ずんだもん","この4つの仕訳を持って、連結財務諸表を作りにいくのだ。まず損益計算書なのだ。"],["めたん","費用と収益は、この4本の仕訳で動いてないんでしょ？"],["ずんだもん","そうなのだ。だから問題文の単純合算のままでいいのだ。"],["めたん","唯一動くのは、個別上に乗っていた売却益3,750よね。"],["ずんだもん","そうなのだ。Ｄの仕訳で、その3,750が全部消えるのだ。"]],[["めたん","つまり、連結損益計算書の子会社株式売却益は、いくらになるの？"],["ずんだもん","必ずゼロなのだ。資本取引なんだから、損益計算書に載っている場合ではないのだ。"],["めたん","非支配株主に帰属する当期純利益とのれん償却額は、タイム・テーブルから取ればいいのね。"],["ずんだもん","そうなのだ。親会社株主に帰属する当期純利益は差額で52,600なのだ。"],["めたん","貸借対照表の資本剰余金は、Ｐ社の個別10,000に、さっきの1,400を足すのよね。"],["ずんだもん","そうなのだ。符号をマイナスにしないよう気をつけるのだ。"],["めたん","売却益を資本剰余金に振り替えたんだから、プラスよね。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","非支配株主持分もタイム・テーブルから取れるのだ。期末の子会社資本合計68,000×40％なのだ。"],["めたん","27,200ね。あれ、さっきまで20％だったのに、なんで40％になるの？"],["ずんだもん","80％から20％売って、60％しか持っていないからなのだ。残りの40％が非支配株主のぶんなのだ。"],["めたん","じゃあ利益剰余金は？"],["ずんだもん","タイム・テーブルの緑で囲った箇所、2年ぶんの累積を拾うのだ。"],["めたん","前期の取得後剰余金4,000、当期の取得後剰余金6,400、のれん償却50×2年、ってところね。"],["ずんだもん","そうなのだ。"]],[["ずんだもん","あと1つ、忘れてはいけないものがあるのだ。"],["めたん","もしかして、さっきの3,750？"],["ずんだもん","そうなのだ。売却益を消したんだから、その分だけ利益が減るのだ。"],["めたん","マイナス3,750も加味するのね。"],["ずんだもん","Ｐ社の個別上の利益剰余金53,750に、緑の項目とこのマイナスを足せば、60,300なのだ。"],["めたん","取得後剰余金だけじゃなくて、売却益の取消も忘れないこと、ね。"],["ずんだもん","そこがポイントなのだ。"]],[["めたん","今の緑から拾う方法、ショートカットなんでしょ？"],["ずんだもん","そうなのだ。せっかくだから、仕訳から集計する方法もやるのだ。"],["めたん","まずはＰ社53,750とＳ社33,000を単純合算するのよね。"],["ずんだもん","そこから、利益剰余金が動く4か所を引くのだ。"],["めたん","開始仕訳の21,050、当期按分の1,600、のれん償却の50、それと売却益の3,750ね。"],["ずんだもん","そうなのだ。どちらの方法でも、60,300で一致するのだ。"],["めたん","仕訳から確かめると、間違いに気づきやすいわね。"],["ずんだもん","慣れるまでは仕訳でやるのだ。慣れたらタイム・テーブルだけで出すのが最終形態なのだ。"]],[["ずんだもん","例題3は終わりなのだ。続いて例題4なのだ。"],["めたん","何が変わるの？"],["ずんだもん","20％を15,000で売ったか、12,000で売ったかの違いだけなのだ。"],["めたん","タイム・テーブルの他の数字は、全部同じってこと？"],["ずんだもん","そうなのだ。個簿価も相変わらず11,250、取得原価45,000の4分の1なのだ。"]],[["めたん","売却価額は12,000だから、個別上の売却益は…11,250との差で750ね。"],["ずんだもん","そうなのだ。Ｐ社の個別損益計算書にも、子会社株式売却益750が計上されているのだ。"],["めたん","でも連結上は、連簿価13,600のほうを使うんでしょ。"],["ずんだもん","そうなのだ。13,600の価値のものを、12,000で売ったことになるのだ。"],["めたん","13,600のものを12,000で売ったら…損してるじゃない。"],["ずんだもん","そうなのだ。だから貸借対照表の資本剰余金が、借方に1,600出るのだ。"],["めたん","符号がプラスからマイナスに変わるのね。"]],[["ずんだもん","連結修正仕訳を切るのだ。個別の売却益750を消して、資本剰余金1,600を借方に振り替えるのだ。"],["めたん","借方に子会社株式11,250と、売却益750と、資本剰余金1,600ね。"],["ずんだもん","そうなのだ。貸方は非支配株主持分13,600、これ1本なのだ。"],["めたん","例題3と借方・貸方が逆になってるじゃない。"],["ずんだもん","そうなのだ。王冠の絵を描けば、この仕訳もパッと切れるはずなのだ。"]],[["ずんだもん","これもタイム・テーブルに反映するのだ。個別上の簿価11,250がまず消えるのだ。"],["めたん","連結上の簿価は、子会社純資産68,000×20％で、13,600のまま変わらないのね。"],["ずんだもん","そうなのだ。売却価額はこの問題では12,000、売却益は△750と書くのだ。"],["めたん","これが個別上の姿ね。"]],[["めたん","連結上は資本剰余金がマイナスになるのよね。符号、間違えそう。"],["ずんだもん","13,600の価値のものを12,000で売っているのだから、損が出る、と考えるのだ。"],["めたん","損のサイド、つまり純資産から見ればマイナス、ってことね。"],["ずんだもん","そうなのだ。そう考えるほうが、プラスマイナスを間違えにくいのだ。"],["めたん","仕訳で確かめても、貸方13,600に対して借方が11,250と750で12,000。差額1,600は借方ね。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","連結損益計算書では、子会社株式売却益はここでも必ずゼロなのだ。"],["めたん","貸借対照表の資本剰余金は、Ｐ社の個別10,000から1,600をマイナスするのよね。"],["ずんだもん","そうなのだ。マイナス1,600だから、8,400になるのだ。"],["めたん","符号を間違えやすいところね。"],["ずんだもん","非支配株主持分は例題3と同じ、68,000×40％で27,200なのだ。"]],[["めたん","利益剰余金にも、さっきの調整が要るのよね。"],["ずんだもん","そうなのだ。マイナス750を忘れる人が多いところなのだ。"],["めたん","Ｐ社53,750とＳ社33,000を合算して、開始仕訳21,050、按分1,600、のれん償却50、そして750を引くのね。"],["ずんだもん","そうなのだ。答えは63,300なのだ。"],["めたん","例題3の60,300と近い数字だけど、符号が違うから差が出るのね。"],["ずんだもん","一部売却も、慣れれば簡単なのだ。"]],[["ずんだもん","今日は例題3と例題4で終わっておくのだ。次の例題5がちょっと予告なのだ。"],["めたん","王冠の絵で仕訳を切って、それで終わりじゃないの？"],["ずんだもん","実はもう1本、仕訳が入るのだ。振り替えた資本剰余金に、税率をかけるのだ。"],["めたん","その分の資本剰余金を、取り消すってこと？"],["ずんだもん","そうなのだ。相手科目は、法人税、住民税及び事業税なのだ。"],["めたん","法人税等調整額じゃないのね。てっきり税効果の話かと思ったわ。"],["ずんだもん","そこが例題5のポイントなのだ。"]],[["ずんだもん","この仕訳の中身は、連結税効果を習ってからじゃないと分からないのだ。"],["めたん","じゃあ今は、どうすればいいの？"],["ずんだもん","今日のところは、王冠の絵の仕訳だけ押さえて、この1本は捨てておいていいのだ。"],["めたん","ゆくゆく、ちゃんと習うのね。"],["ずんだもん","そうなのだ。これで資本連結が終わったのだ。次からは成果連結が始まるのだ。"],["めたん","一部売却も、思ったより簡単だったわね。"],["ずんだもん","そうなのだ。王冠の絵さえ描ければ、怖くないのだ。"]],[["ずんだもん","最後に、164回の会計学とのつながりなのだ。"],["めたん","問2の(8)から(10)、時間切れで空欄だったところね。"],["めたん","金額の単位は千円で聞くわね。"],["ずんだもん","そうなのだ。在外子会社のＳ２社株式を8％、一部売却する問題なのだ。"],["めたん","ベースの考え方は、今日の王冠の絵と同じ？"],["ずんだもん","そうなのだ。個別の売却損益を消して、非支配株主持分と資本剰余金に振り替えるのだ。"],["めたん","164回だけ増えるところもあるの？"],["ずんだもん","為替換算調整勘定の付け替えと、資本剰余金から法人税等相当額を控除する工程なのだ。"],["めたん","あ、それってさっきの例題5の予告と同じ処理ね。"],["ずんだもん","そうなのだ。だから164回は、今日の例題3・4より1段階難しかったのだ。"],["めたん","答えは、資本剰余金が△511、当期純利益が157,247、包括利益が131,187ね。"],["ずんだもん","そうなのだ。ベースが分かっていれば、あとは積み上げていくだけなのだ。"]]],"shorts":[{"hl":"[王冠の絵]で/資本剰余金を一発","at":177.55,"blob":"1ad2c2d8166c270d0ecc0461f975f0df"},{"hl":"寸劇：[王冠の絵]で/資本剰余金を一発","at":177.55,"blob":"bbfd640d9d41999f4596b6fdaa556848"},{"hl":"安く売ったら/資本剰余金は[マイナス]","at":467.7,"blob":"72514f45492c3600f7c86a89ed7f12fe"},{"hl":"寸劇：安く売ったら/資本剰余金は[マイナス]","at":467.7,"blob":"f5207aef430b3e4b93b725669c028d1e"},{"hl":"利益剰余金は/[売却益の取消]も","at":389.22,"blob":"60b1d58727eb7780efbfe6400043103e"},{"hl":"寸劇：利益剰余金は/[売却益の取消]も","at":389.22,"blob":"6c152ea6e01ea61daf6f35b27e77c5bf"}]},{"id":"f28-1","no":"財計27-4","title":"子会社のその他有価証券評価差額金","sub":"商会","ch":27,"probs":["商会26-5"],"w":0.0,"wt":[],"hl":"評価差額金も/[同じ行]","acct":"商会","core":{"t":"子会社のその他有価証券評価差額金は利益剰余金と同じ1行。獲得時の分は相殺で消し、獲得後の増減は矢印の上下に割る","ab":[],"parts":[{"h":null,"judge":[["Ｓ社の「純資産の推移」の表に「その他有価証券評価差額金」の列がある","タイム・テーブルに1行足す。獲得時の残高は資本合計に入れて相殺消去、獲得後の増減は持分比率で上下に按分"],["「発行済株式総数の20％を…で取得した」（追加取得）","追加取得持分は差額金を含む資本合計×追加割合。その後の増減は新しい比率で按分し、前の年は直さない"],["「…の20％を…で売却した」（一部売却）","書いていなくても、獲得後に計上してきた差額金の親会社持分÷売却前比率×売却割合を取り崩す。売却持分はその純額"],["連結貸借対照表の「その他有価証券評価差額金」を答える","親会社の差額金＋年ごとの矢印の上（一部売却なら取崩額を引く）。子会社の残高をそのまま足さない"]],"steps":[["差額金を1行として写す","資本金・利益剰余金と並べてタイム・テーブルに入れ、獲得時の資本合計に含める"],["獲得時の分を相殺で消す","差額金を含めた資本合計で親会社持分・のれん・非支配株主持分を出す。獲得時の残高は全額消える"],["獲得後の増減を割る","年ごとの増減を、その年の持分比率で矢印の上（親会社）と下（非支配株主）に分ける。下は非支配株主持分へ"],["持分が変わったら直す","追加取得は差額金込みの資本合計で持分を出し以後は新比率。一部売却は差額金の取崩しを売却持分から引く"],["連結貸借対照表に書く","差額金は親会社の額＋矢印の上。非支配株主持分は差額金を含む資本合計×期末の非持比率"]],"why":"差額金は子会社の純資産に入る含み益で、利益剰余金と性質が同じ。連結に取り込むのは獲得後の親会社持分","check":"非支配株主持分は、期末の資本合計（差額金込み）×期末の非持比率と一致する","trap":["獲得時の資本合計に差額金を入れ忘れる ―― のれんと非支配株主持分が両方ずれる","追加取得の後も元の比率で按分する、または前の年まで新比率で按分し直す","一部売却で差額金を取り崩さない ―― 売却持分が大きくなり、差額金が取崩額だけ残る"],"skip":["追加取得では非支配株主持分を差額金へ振り替える処理はしない（一部売却とは非対称）","差額金が減った年も同じ割り方。増加と同じ比率でマイナスを上下に分ける"]}]}},{"id":"f29-1","no":"財計27-5","title":"評価差額が実現した場合","sub":"商会","ch":27,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"子会社の資産に付けた評価差額は、外部に売るか減価償却で損益に出る。評価差額の行は動かさ ,"売上原価・商品は単純合算＋修正仕訳、税効果はT勘定、資本連結の項目はタイム・テーブル（未実現利益は税引後）"]],"why":"単純合算と連結の差は連結修正仕訳そのもの。その分だけ連結の利益と個別で納めた税金がずれる","check":"法人税等調整額は、期首分の戻し（借方）と期末分の消去（貸方）の差になる","trap":["未実現利益に売上総利益率をもう一度掛けて税効果にする ―― 掛けるのは法定実効税率","Ｐ社の繰延税金資産とＳ社の繰延税金負債を差し引きする ―― 納税主体が違うので両建て","タイム・テーブルに税引前の未実現利益を入れる ―― 入れるのは消去額－税効果"],"skip":["法人税等調整額はP/L項目なので、下書きでＰ社・Ｓ社に分けなくてよい","税効果の仕訳は切らなくてよい。T勘定に直接入れれば答えが取れる"]}]}},{"id":"f30-2","no":"財計29-2","title":"アップストリームの税効果と翌期の引継ぎ","sub":"商会","ch":29,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"アップの未実現利益は税効果ごと子会社に帰属する。子会社のタイム・テーブルに未実現利益×（1－税率）を入れて按分し直す","ab":[["ダウン（親会社が売り手）","繰延税金資産はＰ社名義。親の利益剰余金から税引後の未実現利益を引く"],["アップ（子会社が売り手）","繰延税金資産はＳ社名義。子会社のタイム・テーブルに税引後で入れ、矢印の上を足すだけ"]],"parts":[{"h":null,"judge":[["「Ｓ社のＰ社に対する商品販売高」","アップ。未実現利益と税効果の純額（税引後）を非支配株主にも按分する"],["税効果を考慮する指示がある（タイム・テーブルの記入額は書いていない）","タイム・テーブルには未実現利益×（1－税率）を入れる。税引前のまま入れない"],["「期首商品に…、期末商品に…が含まれている」","期首は引継ぎと実現をまとめた1本、期末は消去1本。税効果もそれぞれタスキ掛けで乗せる"],["「Ｐ社のＳ社に対する商品販売高」（ダウン）","子会社の表には載らない。利益剰余金の集計で税引後の期末未実現利益を引く"]],"steps":[["消去の2本だけ手で切る","期首は「利益剰余金－当期首残高／売上原価」、期末は「売上原価／商品」"],["税効果をT勘定で読む","Ｐ社・Ｓ社・法人税等調整額の3列。B/S項目の税効果は売り手（アップならＳ社）の列へ"],["タイム・テーブルを税引後で直す","子会社の「未実現利益（アップ）」に期末残高×（1－税率）を入れる"],["修正後の利益で按分する","子会社の利益＋期首分（税引後）－期末分（税引後）に非持比率を掛ける。按分の仕訳は切らない"],["3か所から答えを集める","売上原価・商品は単純合算＋2本、税効果はT勘定、非支配株主と利益剰余金はタイム・テーブル"]],"why":"消去も税効果も売り手の子会社の利益を動かす。動いた純額は子会社の株主である非支配株主にも及ぶ","check":"アップの利益剰余金は、親の個別額＋矢印の上だけで出る（切った仕訳を足し直さない）","trap":["税効果がないときの癖で未実現利益を税引前のままタイム・テーブルに入れる","アップで、修正済みのタイム・テーブルに加えて切った仕訳の損益をもう一度利益剰余金に足す","ダウンで、利益剰余金の集計から税引後の未実現利益を引き忘れる ―― 子会社の表に載らないので落ちやすい"],"skip":["フルスペックの期首4本・期末3本は切らなくてよい。按分はタイム・テーブル、税効果はT勘定で済む","按分を資本連結と成果連結に分けて切っても、修正後の利益で1本にまとめても答えは同じ"]}]}},{"id":"f30-3","no":"財計29-3","title":"アップとダウンをひっくるめた連結のルール","sub":"商会","ch":29,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"切るのは連結修正仕訳だけ。それを×税率で税効果、アップならさらに純額×非持比率で按分し、どれも売り手に帰属させる","ab":[],"parts":[{"h":null,"judge":[["ダウン・アップの名指しが無く「Ｐ社は…Ｓ社へ」「Ｓ社は…Ｐ社へ」とだけある","売り手で決める。Ｐ社が売り手ならダウン、Ｓ社ならアップで、アップだけ非支配株主への按分が要る"],["「売掛金の期末残高に対して２％の貸倒引当金を計上」（税効果あり）","借方 貸倒引当金の修正をタスキ掛けすると貸方に来るので繰延税金負債。債権者（売り手）の会社に付ける"],["「当該土地を当期に企業集団外部へ売却した」","引継ぎと実現をまとめて「利益剰余金－当期首残高／固定資産売却益」の1本。税効果もこの1本から出す"],["土地・備品の資料が「売却価額」と「帳簿価額」","差額が未実現利益。売却価額そのものを消さない"]],"steps":[["修正仕訳を1本切る","出てくるのはB/S項目・P/L項目・利益剰余金－当期首残高の3種類。どれが出たかを見る"],["×税率で税効果を出す","反対側へ移し、B/S項目は借方なら繰延税金資産・貸方なら繰延税金負債、P/L項目は法人税等調整額。T勘定へ直接入れる"],["売り手の会社に付ける","未実現利益は販売側、貸倒引当金は債権者側。どちらも売り手で、ダウンならＰ社、アップならＳ社"],["アップなら×非持比率","修正仕訳と税効果の純額を反対側へ。B/Sは非支配株主持分、P/Lは非支配株主の損益。タイム・テーブルに税引後で入れる"]],"why":"修正仕訳そのものが一時差異で、それが売り手の利益を動かす。売り手が子会社ならその株主の非支配株主にも及ぶ","check":"","trap":["アップなのに繰延税金資産・負債をＰ社で立てる ―― 帰属先は売り手","貸倒引当金の修正の税効果を繰延税金資産にする ―― 移した先が貸方なので繰延税金負債","アップの按分を、修正仕訳だけの額に非持比率を掛けて出す ―― 税効果と合わせた純額に掛ける"],"skip":["税効果とアップの按分は仕訳として切らない。T勘定とタイム・テーブルで済む","利益剰余金－当期首残高は、税効果でも按分でも反対側に移して利益剰余金－当期首残高のまま"]}]}},{"id":"f30-4","no":"財計29-4","title":"評価差額の税効果と、税率が違うとき・変わったとき","sub":"商会","ch":29,"probs":["商会26-9"],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"税効果は誰に帰属するかで税率も扱いも決まる。評価差額は子会社に帰属し、差×税率を繰延税金負債、残りを評価差額にする","ab":[["未実現利益の税効果","売り手の税率。税率が変わっても再計算しない（課税は売った年に済んでいる）"],["評価差額の税効果","子会社の税率。税率が変わったら再計算し、差額は法人税等調整額（評価差額は動かさない）"]],"parts":[{"h":null,"judge":[["「Ｓ社の土地（帳簿価額…）の時価は…」（税効果を考慮する）","差×税率を繰延税金負債（Ｓ社）、差×（1－税率）を評価差額としてタイム・テーブルへ"],["「Ｐ社の実効税率は30%、Ｓ社の実効税率は40%」","ダウンの未実現利益は親、アップは子、評価差額は子の税率。帰属先が違う繰延税金資産と負債は相殺しない"],["「…中に翌年以降の税率が…になることが判明した」","未実現利益には使わず売った年の税率のまま。評価差額の繰延税金負債だけ新税率で直し、差を法人税等調整額へ"],["「貸倒引当金繰入額は全額損金不算入」（個別で税効果を適用）","個別に繰延税金資産が立っている。連結で同額の繰延税金負債を立てて相殺し、繰延税金資産を減らす"]],"steps":[["帰属先を決める","未実現利益は売り手、貸倒引当金は債権者、評価差額はその資産を持つ子会社。これで税率とT勘定の箱が決まる"],["評価差額を割る","時価－帳簿価額を、×税率の繰延税金負債（子会社）と×（1－税率）の評価差額に分ける"],["実現したら一緒に落とす","外部売却や減価償却で評価差額が実現したら、実現額×税率の繰延税金負債も取り崩す。タイム・テーブルには純額"],["税率変更を仕分ける","未実現利益は再計算しない。評価差額の繰延税金負債は新税率で直し、差額は子会社の利益としてタイム・テーブルで按分"],["会社ごとに締める","個別の繰延税金資産・負債も入れて会社ごとに相殺。会社をまたぐ相殺はせず両建て"]],"why":"評価差額は貸借とも貸借対照表の項目で損益に差が出ないので、税額を法人税等調整額にできず、評価差額から抜くしかない","check":"子会社の繰延税金負債は、評価差額の繰延税金負債から実現で取り崩した額を引いた残りになる","trap":["税効果がある問題で、評価差額を時価と簿価の差のままタイム・テーブルに入れる ―― 入れるのは（1－税率）倍","税率変更の資料で、未実現利益の税効果まで新税率で直す","Ｐ社の繰延税金資産とＳ社の繰延税金負債を相殺して純額で答える"],"skip":["評価差額の税率変更ではのれんを再計算しない（評価差額そのものを直さないから）","評価差額の税効果は仕訳を切らず、繰延税金負債はT勘定、評価差額はタイム・テーブルに直接入れてよい"]}]}},{"id":"w29-5","no":"財計29-5","title":"一部売却と税金 資本剰余金×税率は法人税等へ・売却予定ならDTLも（例題2・例題5）","sub":"商会","ch":29,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"下書きはタイムテーブルに売却部分の個別上の簿価と連結上の簿価を並べる。資本剰余金×税率は法人税等へ、DTLは売却を決めたときだけ","ab":[],"parts":[{"h":"個別と連結の簿価の差は普段は放置。売却を決めたら売却割合分×税率でDTL","judge":[["「×4年度中にＳ社発行済株式総数の20％を売却することを決定していた」","売却割合部分の投資に係る一時差異が解消する。（連結上の簿価−個別上の簿価）×税率で繰延税金負債"],["売却の決定・計画の記載が無い一部売却","差異は解消しないので税効果を認識しない"]],"steps":[["個別上の簿価（売却部分）","取得原価÷取得割合×売却割合＝45,000÷80％×20％＝11,250"],["連結上の簿価（売却部分）","売却時の資本合計×売却割合＝60,000×20％＝12,000。支配が続くのでのれんは入れない"],["差額×税率でDTL","（12,000−11,250）×40％＝300。決定した年度に法人税等調整額／繰延税金負債"]],"why":"売却すると個別の売却益（課税所得）が連結の利益より大きくなる＝将来加算一時差異","check":"","trap":["連結上の簿価（売却部分）にのれんの減少額を足す ―― 支配が続く一部売却ではのれんを取り崩さないので含めない"],"skip":["DTLの出し方は2通り ―― のれんを除いた差異3,000×20/80×40％でも（12,000−11,250）×40％でも同じ300"]},{"h":"連結は売却益でなく資本剰余金。その税は資本剰余金から法人税等へ、売却予定のDTLは取崩す","judge":[["「連結上，関係会社株式売却益に対応する法人税等は，資本剰余金から控除する」","資本剰余金×税率を、借方 資本剰余金・貸方 法人税等。一部売却の修正仕訳とセット"]],"steps":[["普段の一部売却の修正","関係会社株式11,250・売却益3,750／非支配株主持分12,000・資本剰余金3,000"],["資本剰余金×税率を法人税等へ","資本剰余金1,200／法人税等1,200（3,000×40％）。貸方は法人税等調整額ではない"],["売却を決めていたらDTL取崩し","繰延税金負債300／法人税等調整額300。個別の税金1,500のうち残った300が消える"],["答えを出す","法人税等 20,000＋5,000−1,200＝23,800、法人税等調整額△300、資本剰余金 3,000×60％＝1,800"]],"why":"","check":"個別の売却益に係る税1,500（3,750×40％）＝資本剰余金からの控除1,200＋DTLの取崩し300","trap":["資本剰余金を3,000と答える ―― 税率が与えられていれば1,200を控除して1,800","資本剰余金からの控除の相手を法人税等調整額にする ―― 税金の修正なので法人税等"],"skip":["期末の利益剰余金にDTL300の発生と解消を入れない ―― 当期末で全て解消し、影響しない（テキストの注）"]},{"h":"売却の決定が無ければDTLは無し。資本剰余金×税率を法人税等へ振り替える仕訳だけ","judge":[["「子会社への投資に係る一時差異については，税効果会計を適用しない」","繰延税金負債の計上も取崩しもしない"],["「連結上，子会社株式売却益に対応する法人税等は，資本剰余金から控除する」","資本剰余金×税率を資本剰余金から法人税等へ振り替える"]],"steps":[["一部売却の修正","子会社株式11,400・売却益3,600／非支配株主持分12,000・資本剰余金3,000"],["資本剰余金×税率を法人税等へ","資本剰余金1,200／法人税等1,200（3,000×40％）"],["答えを出す","資本剰余金 3,000−1,200＝1,800、法人税等 20,000＋2,000−1,200＝20,800"]],"why":"子会社株式売却益が連結で取り消されるので、それに対応する税金も資本剰余金から控除する","check":"","trap":["売却益が資本剰余金に変わったからとDTLも立てる ―― 売却の決定が無く、税効果を適用しない指示がある"],"skip":["追加取得では法人税等相当額の控除はしない ―― 損益が取り消されないため（テキスト㉙Ⅱ-27のワンポイント）"]}]}},{"id":"w29-6","no":"財計29-6","title":"全部売ると決めていたとき 子会社に対する投資の一時差異（例題1）","sub":"商会","ch":29,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"下書きはタイムテーブルに個別45,000と連結48,900（持分＋のれん）を並べ、差×税率をDTLに。売却時に取り崩す","ab":[],"parts":[{"h":null,"judge":[["「80％を売却することを決定していた」「一時差異について，税効果会計を適用することとした」","売却で解消する差異に、決めた期でDTLを計上する指示。保有分を全部売って支配を失うので、のれん未償却残高も連結上の簿価に入れる"],["「子会社への投資に係る一時差異については、税効果会計を適用しないものとする」","1級テキストの例題の指示。投資の差異には何もしない（1級の基本の扱い）"]],"steps":[["売却部分の個別上の簿価を出す","取得原価45,000÷80%×売却割合80%＝45,000"],["売却部分の連結上の簿価を出す","減少持分60,000×80%＝48,000に、のれん減少額900を足して48,900。支配を失うのでのれんも取り崩す側"],["差×税率でDTLを計上する","（48,900－45,000）×40%＝1,560。×5年3月期に法人税等調整額1,560／繰延税金負債1,560"],["売却した期の益と税を並べる","個別は売却益25,000・税10,000。連結は損益取引で売却益70,000－48,900＝21,100、あるべき税8,440"],["売却益を直しDTLを取り崩す","売却益を3,900取り消し、繰延税金負債1,560／法人税等調整額1,560。10,000－1,560＝8,440"]],"why":"差異は売却で解消する。売却を決めた期にDTLを立てておくと、売却時の取り崩しで連結上の売却益21,100に見合う税8,440になる","check":"個別の法人税等10,000－取り崩し1,560＝8,440＝連結上の売却益21,100×40%","trap":["支配を失う売却の差異を4,000－のれん1,000＝3,000とする ―― 正しくは4,000－償却100＝3,900。のれん900も売却で取り崩す","支配を失う売却の差額を資本剰余金にし、資本剰余金から税を控除する ―― 正しくは損益取引の売却益。税はDTLの取り崩しで合わせる"],"skip":["この計算そのもの ―― 1級テキストでは参考扱いで、基本は税効果を適用しない。1級の例題の資料も適用しない指示。講師も支配が続く方だけで十分と言う","連結除外の仕訳 ―― この問題は省いていて、差異の論点に関係しない"]}]}},{"id":"z29-3","no":"財理29-3","title":"連結税効果（連結固有の一時差異）","sub":"商会","ch":29,"probs":["商会26-9"],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"連結修正仕訳そのものが一時差異。たすき掛けで左に出ればDTA、右ならDTL。未実現利益のDTAだけは繰延法","ab":[],"parts":[{"h":null,"judge":[["「連結子会社の留保利益及びのれんの償却額を除き、税効果を考慮する」","のれんには税効果を認識しない（利益→のれん→償却→税効果と循環するから）。評価差額・未実現利益・貸倒引当金の修正には掛ける"],["「貸倒引当金繰入超過額は発生しておらず、すべて損金算入されている」","個別に一時差異が無い。連結で貸倒引当金を減らすと会計上だけ変わるので、DTLを立てる（債権者側の税率で）"],["親会社から子会社へ販売し、子会社の期末商品に親会社からの仕入分","ダウン・ストリームの未実現利益。消去額×税率でDTA・法人税等調整額（貸方）。売った会社の税金が上限で、税率変更でも見直さない"],["支配獲得日の子会社の土地の「時価」が帳簿価額と違う","評価差額×税率がDTL。評価差額からDTLを引いた額を子会社の資本にする（タイムテーブルには税引後の額）"]],"steps":[["一時差異はどこにあるか","税務は個別の単純合計、会計は連結。だから連結修正仕訳の分がそのまま一時差異（連結財務諸表固有の一時差異）"],["たすき掛けでDTAかDTLか","修正仕訳のB/S科目を反対側へ。未実現利益の消去・借方の為替換算調整勘定はDTA、子会社の評価益・貸倒引当金の減額はDTL"],["評価差額はDTLを引いて資本へ","評価差額から税効果を引いた額が子会社の資本。税率変更と土地の売却の相手はどちらも法人税等調整額（評価差額は動かさない）"],["未実現利益のDTAは繰延法","発生した会社と持つ会社が違い、売った会社は課税済み。税率変更で見直さず、回収可能性も見ない。上限は売った会社の税金"],["連結で消した貸倒引当金","通常は個別のDTAと連結のDTLを同じ会社で相殺。個別でDTAを立てていない（回収可能性なし）ならDTLも無し。税務も損金算入済みならDTL"]],"why":"税金は会社ごとに個別で払うので、連結でだけ入れた修正は税務には無い。その差を法人税等調整額で埋めて、連結の利益と税金を対応させる","check":"","trap":["未実現利益のDTAを税率変更で再計算する ―― ここだけは繰延法で見直さない","売った会社の税金を超えて未実現利益×税率をDTAにする ―― 上限は売った会社が払った税金","税務上も損金算入済みの貸倒引当金を連結で消したのに、DTLを立てない ―― 個別に差が無い分、連結で差が生まれる"],"skip":["繰延法が残った理由は基準の2つ（発生と保有の会社が違う・課税済み）で答える。1998年より前の実務への配慮は背景"]}]}},{"id":"z29-4","no":"財理29-4","title":"子会社への投資の一時差異（＋第35章の残り）","sub":"商会","ch":29,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"子会社への投資の一時差異は、個別の取得原価と連結上の価額の差。差が解消する見込み（売却・配当）があるときだけ税効果を立てる","ab":[],"parts":[{"h":null,"judge":[["「売却等を自分で決められ、かつ予測できる将来に売却する意思がない場合を除き」","連結上の価額の方が大きい分（将来加算）にDTL。売る予定がなければ差は縮まらないので立てない"],["子会社の損失で、連結上の価額が「個別上の価額よりも小さい」","理論上は将来減算でDTA。原則は立てない（業績の悪い子会社で資産を立てるのは粉飾のよう）。解消の可能性が高く回収可能性があれば立てる"],["子会社からの配当が予定されている","海外子会社ならDTL（受け取る年に親会社の税金が増える）。国内子会社なら二重課税の排除で課税されず、仕訳なし"],["「連結会社が振り出した手形を他の連結会社が銀行で割り引いた」","連結上は借入金に振り替える"]],"steps":[["差がどこから生まれるか","投資した瞬間は差が無い。その後、取り込んだ子会社の利益とのれん償却で連結上の価額が動き、取得原価のままの税務と差が開く"],["解消する3つの場面を言う","子会社からの配当・株式の売却・個別の評価損（税務も損金算入）。解消しないなら永久差異と同じで立てない"],["向きでDTLかDTAか決める","連結上の価額が大きい（利益の取り込み）なら将来加算でDTL。小さい（損失の取り込み）なら将来減算でDTAだが、原則立てない"],["のれんと取得関連費用","のれんには税効果を認識しない（無限に循環する）。取得関連費用は個別の取得原価が大きいので将来減算でDTA、売却予定のときだけ"],["子会社の欠損は親会社説で","非支配株主持分はゼロまで。超えた分は親会社が負担し、その後の利益はまず親会社の負担分の回収に充てる"]],"why":"税務は取得原価のまま、連結は子会社の損益を取り込む。差が縮まる出来事（売る・配当をもらう）が見込めるときだけ、将来の税金の増減を今立てる","check":"","trap":["差があればいつもDTLを立てる ―― 売却計画や配当予定が無ければ差は縮まらない","国内子会社からの配当予定にDTLを立てる ―― 二重課税の排除で税金は増えない","子会社の欠損で非支配株主持分をマイナスにする ―― 原則ゼロまで（出資を超えて負担する合意があれば例外）"],"skip":["配当に係るDTLと取得関連費用のDTAは計算では出にくい。理論で問われる","子会社株式の一部売却に関連する法人税等は、法人税等調整額ではなく法人税等を修正して資本剰余金から控除する、で足りる"]}]}},{"id":"m30-1","no":"財計30-1","title":"持分法の基本 投資と資本の相殺はいらない","sub":"商会","ch":30,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"持分法は合算しない簡便版の連結。矢印の上とのれん償却だけを投資有価証券に足し引きし、相手科目は持分法による投資損益","ab":[["連結（子会社）","合算してから要らない所（取得前の利益剰余金・矢印の下）を消す。のれんは勘定科目に出る"],["持分法（関連会社）","合算しない。要る所（矢印の上・のれん償却）だけ投資有価証券に取り込む。のれんは投資有価証券の中"]],"parts":[{"h":null,"judge":[["「発行済株式総数の…%を取得し、持分法適用関連会社とした」","投資と資本の相殺はしない（合算しないので消すものがない）。タイム・テーブルは連結と同じ形、のれんは差額で見るだけ"],["関連会社の当期純利益が無く、利益剰余金の推移と配当の日付・金額がある","期首＋当期純利益－配当＝期末の貸借差額で利益を推定する。前期は利益と配当の純額でよい"],["「P社には連結子会社がいるが、その存在は考慮しない」","P社の個別の数字に持分法の修正だけを足し引きする。非支配株主持分は考えない"],["連結財務諸表の「受取配当金」を問われる","P社の受取配当金から、関連会社の配当×持分比率を引く。関連会社の個別P/Lの受取配当金は集計しない"]],"steps":[["タイム・テーブルを書く","連結と同じ形。取得原価と資本合計×持分比率の差がのれん。仕訳は切らない"],["利益を取り込む","矢印の上を（借）投資有価証券／（貸）持分法による投資損益"],["配当を修正する","配当×持分比率を（借）受取配当金／（貸）投資有価証券"],["のれんを償却する","（借）持分法による投資損益／（貸）投資有価証券。のれん償却という科目は使わない"],["前期分は開始仕訳で純額に","前期の矢印の上－のれん償却の純額を、投資有価証券／利益剰余金－当期首残高で引き継ぐ"]],"why":"相手を合算しないので二重になる物が無く、相殺は要らない。純資産を動かす科目を投資有価証券1本に置き換えるので一行連結","check":"投資有価証券が、期末の資本合計×持分比率＋のれん未償却残高と一致する","trap":["配当の修正の借方を持分法による投資損益にする ―― 関連会社のP/Lは動いていない。消すのはP社の受取配当金","持分法による投資損益に配当の分を入れる ―― 配当は受取配当金と投資有価証券を動かし、投資損益には入らない","矢印の下を非支配株主持分へ振り替えようとする ―― 持分法に非支配株主持分は出ない"],"skip":["単純合算してから引く連結の道は試験中に書かなくてよい ―― 利益剰余金は持分法の道と一致する（理解用）"]}]}},{"id":"m30-2","no":"財計30-2","title":"持分法の時価評価と取得関連費用","sub":"商会","ch":30,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"持分法の時価評価は持分比率分だけ（部分時価評価法）。評価差額は税効果後の額を二重線の下に置き、付随費用は取得原価に含めたまま","ab":[["連結（子会社）","全面時価評価法（差額の全部）。付随費用は取得原価から除いて費用"],["持分法（関連会社）","部分時価評価法（差額×持分比率）。付随費用は投資原価に含めたまま"]],"parts":[{"h":null,"judge":[["「…%を取得し、持分法適用関連会社とした」と、土地の帳簿価額・時価","（時価－帳簿価額）×持分比率だけを評価差額にする"],["「取得原価には付随費用が…含まれている」","何もしない。付随費用込みの取得原価とＰ社持分の差がのれん"],["「法定実効税率…%」が評価差額に掛かる","差額×持分比率×（1－実効税率）の純額だけをタイム・テーブルへ。繰延税金負債は入れない"]],"steps":[["評価差額を出す","（時価－帳簿価額）×持分比率。税効果があればさらに×（1－実効税率）"],["二重線の下に置く","資本合計 額。行が0になっても注記では発生と組替に分けて書く"],["Ｂ/Ｓの累計額を出す","親会社の期末残＋子会社と持分法適用会社の矢印の上の累計。取り崩した分は引く"]],"why":"組替調整は、差額金がPLに落ちて当期純利益と二重に数えるのを防ぐもの。純資産の中の振替は増資・配当と同じ株主との直接的な取引","check":"縦に足した親会社株主・非支配株主に係る包括利益の合計が、横に足した包括利益と一致する","trap":["子会社の一部売却で取り崩した差額金を、左下のマイナスや組替調整額にする ―― 欄外","持分法適用会社の矢印の下を田の字の右下に入れる ―― 持分法は取り込まない","持分法の一部売却の取崩を組替調整にしない ―― 売却益に落ちるので組替調整"],"skip":["持分法適用会社が繰延ヘッジ損益などを持っていても分けなくてよい ―― 重要性が乏しいので1行にまとめる"]}]}},{"id":"t33-1","no":"財計32-1","title":"連結退職給付 未認識数理差異を負債に載せる","sub":"商会","ch":32,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"個別の引当金は予定値、連結は実際額を退職給付に係る負債に載せる。差の未償却残高は調整累計額と繰延税金資産で受け、P/Lは動かない","ab":[["個別（退職給付引当金）","債務の実績−年金資産−差異の未償却残高。予定値で載る"],["連結（退職給付に係る負債）","債務の実績−年金資産。個別に未償却残高を足した額"]],"parts":[{"h":null,"judge":[["「発生年度の翌期から…費用処理する」","当期の費用処理額は0。未償却残高＝当期発生額。注記の組替調整額も0"],["「発生年度より…費用処理する」（当期から）","当期に発生額÷年数を費用処理。未償却残高＝発生額−当期の費用処理額"],["「当期末の退職給付債務実績額」「当期末の年金資産評価額」","T勘定の外に置き、中で積んだ予定額と比べて差異を拾う。企業年金なら差異は2か所で出る"],["「法定実効税率は…である」","負債は未償却残高の全額を増やす。相手勘定を税率分の繰延税金資産と残りの調整累計額に割る"]],"steps":[["個別の下書きを書く","債務（と年金資産）のT勘定で期末の予定額を出し、実績と比べて差異を拾う"],["未償却残高を出す","差異の発生額から、当期の費用処理額を引く"],["科目を振り替える","退職給付引当金を退職給付に係る負債へ。金額は個別のまま動かさない"],["金額を直す","負債を未償却残高だけ増やし、相手勘定を繰延税金資産と退職給付に係る調整累計額に割る"],["計算書に載せる","B/Sは調整累計額（期末残高）、CIは調整額（期首からの変動）。P/Lの退職給付費用は個別のまま"]],"why":"個別は差異を遅れて費用にする予定値だが、連結はより正確に開示するため実際額を負債にする。相手は純資産なのでP/Lに触れない","check":"連結の負債＝当期末の債務実績額−年金資産評価額＝個別の引当金＋未償却残高","trap":["連結修正で退職給付費用に未償却残高を足す ―― 相手勘定は純資産。P/Lは動かない","調整累計額と調整額を同じ金額と思う ―― 期首に残高があれば、CIの調整額は期末−期首","注記の当期発生額に税引後の額を書く ―― 税引前に戻してから、税効果調整額を別行で引く"],"skip":["企業年金でも連結修正のロジックは一時金と同じ。未償却残高を足すだけ"]}]}},{"id":"t33-2","no":"財計32-2","title":"連結退職給付の税効果と例題4","sub":"商会","ch":32,"probs":["商会32-1"],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"個別は遅延認識、連結は即時認識。B/Sの調整累計額は期末の未認識×（1−税率）、C/Iの調整額はその1年の増減×（1−税率）","ab":[["遅延認識（個別）","当期に費用処理した分しか負債に載らない。引当金＝債務の実績額−未認識の差異"],["即時認識（連結）","未認識の額を全額いま負債に載せる。負債＝債務の実績額−年金資産の評価額"]],"parts":[{"h":null,"judge":[["退職給付引当金と「退職給付債務の実績額」が期ごとに並ぶ","その期末の未認識＝実績額−引当金。期首と期末の2つを出す"],["「期首において未認識…の差異が…生じている（3年費用処理済）」","残りの年数で割って当期の費用処理額を出す。期末の未認識＝期首−当期の費用処理額"],["「当期首に退職給付規程が改訂…退職給付債務が…となった」","当期首に過去勤務費用が発生。扱いは数理計算上の差異と同じ"],["組替調整の注記（当期発生額・組替調整額）を書かせる","税引前に戻す。当期に出て当期から償却した分は純額で当期発生額、前期以前の差異の償却分が組替調整額"]],"steps":[["未認識を期首と期末で出す","実績額−引当金。または期首の未認識−当期の費用処理額＋当期の発生額"],["負債を実績額にする","引当金を退職給付に係る負債へ振り替え、期末の未認識だけ負債を増やす"],["相手勘定を割る","期首分は当期首残高、1年で動いた分は当期変動額。それぞれ税率で割り、繰延税金資産と負債だけ相殺"],["B/SとC/Iを出す","調整累計額＝期末の未認識×（1−税率）、調整額＝その増減×（1−税率）。不利差異が増えればマイナス"],["注記を分ける","税引前に戻し、当期に出た差異を当期発生額、前期以前の差異の償却を組替調整額に置く"]],"why":"IFRSに合わせて連結は即時認識にしたが、個別まで変えると実務が混乱するので、当面は連結だけに適用する","check":"連結の負債−個別の引当金＝期末の未認識の差異","trap":["当期に出て当期から償却した差異を、発生額（総額）と組替調整額に分けて書く ―― 当期発生額は純額、組替調整額は0","「3年費用処理済」を読み落として元の年数で割る ―― 残りの年数で割る","調整累計額の当期首残高と当期変動額を相殺する ―― 別の勘定項目。相殺するのは繰延税金の資産と負債"],"skip":["修正仕訳を切らなくても、B/SとC/Iは未認識の期末残高と増減に（1−税率）を掛ければ出る"]}]}},{"id":"t33-3","no":"財計32-3","title":"連結退職給付の続き 例題5・6","sub":"商会","ch":32,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"子会社の未認識差異は、支配獲得後なら調整累計額として持分で割れ、支配獲得時からあれば負債の時価評価（評価差額）として毎期実現させる","ab":[["支配獲得後に出た差異","子会社の調整累計額の変動。持分比率で割り、非支配株主分は非支配株主持分へ"],["支配獲得時にあった差異","負債の時価評価。評価差額はマイナスで立て、個別の費用処理を毎期取り消す"]],"parts":[{"h":null,"judge":[["子会社の個別B/Sの退職給付引当金と「当期末未認識不利差異」","負債を未認識だけ増やし、調整累計額と繰延税金資産に割る。変動をタイムテーブルに入れる（不利ならマイナス）"],["支配獲得日（前期末）にすでに「未認識不利差異」がある","全面時価評価の評価差額。差異×（1−税率）をマイナスで入れ、残りは繰延税金資産"],["「当該差異は5年にわたって費用処理する」（支配獲得時からの差異）","個別の費用処理とその税効果を毎期取り消す。子会社の利益が増えるので、按分は修正後の利益で"],["連結B/Sの調整累計額と連結C/Iの調整額を両方答える","B/Sは矢印の上（親会社分）だけ。C/Iは発生源泉別なので矢印の上も下も"]],"steps":[["差異がいつ出たかを見る","支配獲得後に出たなら調整累計額、支配獲得時にあったなら評価差額"],["負債を実際値に直す","科目を退職給付に係る負債に替え、未認識の差異を足す。相手は（1−税率）の純資産科目と繰延税金資産"],["タイムテーブルに入れる","借方に出た純資産科目はマイナス。持分比率で親会社分と非支配株主分に割る"],["評価差額を実現させる","個別が切った費用処理と税効果を取り消し、増えた利益をタイムテーブルに足してから按分する"],["計算書に分けて載せる","B/Sの調整累計額は親会社分だけ。C/Iは田の字で、親会社分と非支配株主分を縦横に足す"]],"why":"連結は支配獲得時に差異の全額を負債にしているので、あるべき仕訳は「仕訳なし」。個別の費用処理を取り消すのが評価差額の実現","check":"親会社株主に係る包括利益＋非支配株主に係る包括利益＝包括利益（田の字の縦計と横計が合う）","trap":["評価差額をプラスで入れる ―― 負債の時価評価なので借方でマイナス。間違えるとのれんも非支配株主持分も合わない","修正前の子会社利益で非支配株主に按分する ―― 実現で増えた利益を足した後で按分する","開始仕訳で借方残の評価差額を借方に書く ―― 貸方に書いて消す"],"skip":["田の字の上段（当期純利益の内訳）は連結P/Lから写すだけ。新しく計算しない"]}]}},{"id":"t33-4","no":"財計33-1","title":"在外支店の換算","sub":"商会","ch":33,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"在外支店はB/Sを先に換算し、貸借差額の当期純利益をP/Lへ運ぶ。貨幣項目はCR、非貨幣項目はHR、収益費用はAR、最後の差額が為替差損益","ab":[["原則","貨幣項目はCR、非貨幣項目はHR（本店の外貨建取引と同じ）"],["容認","収益・費用はAR。非貨幣項目に重要性がなければB/S項目は全部CR"]],"parts":[{"h":null,"judge":[["「収益・費用項目で、特に指示のないものは、期中平均為替相場で換算する」","売上・当期商品仕入高・支払済みの営業費はAR。受取時のレートが分かる利息などはHRに戻す"],["「決算整理後残高試算表」に載っている仕入","もう売上原価。ARは当期商品仕入高に掛け、期首・期末商品はHR、売上原価は差額で出す"],["「本店における支店勘定の金額は…円である」","本店勘定は照合勘定なので換算しない。その円の金額をそのまま入れる"],["期末商品の「正味売却価額」（低価法）","時価属性なのでCR。HRのままだと当期純利益も為替差損益もずれる"]],"steps":[["B/SとP/Lを区切る","試算表に線を引き、B/Sから先に換算する"],["B/Sを換算する","貨幣項目と貸倒引当金はCR、非貨幣項目と減価償却累計額はHR、本店は円の金額のまま"],["当期純利益を出す","B/Sの貸借差額が当期純利益（支店には資本金も利益剰余金も無い）。これをP/Lへ運ぶ"],["P/Lを換算する","収益・費用はAR、日付の分かるものはHR、未払の分はCR。繰入額と減価償却費はB/Sと同じレート"],["差額を為替差損益にする","P/Lの貸借差額が為替差損益。借方に出れば差損、貸方に出れば差益"]],"why":"支店には資本が無いのでB/Sの差額がそのまま利益になる。P/Lを項目ごとのレートで埋めて残るズレは為替から来た分","check":"B/Sで出した当期純利益とP/Lに運んだ当期純利益が同じ円の金額になっている","trap":["後T/Bの仕入（売上原価）にARを掛ける ―― 期首・当期仕入・期末を換算した差額で出す","営業費を全部ARにする ―― 未払の分は未払営業費と同じCR","低価法の期末商品をHRにする ―― 時価属性なのでCR"],"skip":["本店との合算（内部利益の消去）は手数が多く難しめ。優先は支店単独の換算と為替差損益"]}]}},{"id":"z34-1","no":"財計34-1","title":"在外子会社の換算 どのレートを使うか","sub":"商会","ch":34,"probs":["商会34-1"],"w":0.0,"wt":[],"hl":"","acct":"商会","core":{"t":"在外子会社は1つのレートで簡便に換算する。P/LはＡＲ、B/SはＣＲ。親会社側と消し合う所だけＨＲに戻し、ずれは差額科目で受ける","ab":[["損益計算書（フロー）","ＡＲ。親会社との取引による収益・費用だけＨＲ。貸借差額は為替差損益"],["貸借対照表（ストック）","ＣＲ。資本金・資本剰余金（資本連結の評価差額も）は支配獲得時のＨＲ。貸借差額は為替換算調整勘定"]],"parts":[{"h":null,"judge":[["Ｐ社の営業外収益に「Ｓ社からの受取利息」が円とドルで書いてある","Ｓ社の支払利息のうちその分だけＨＲ（Ｐ社の円額をそのまま使う）。残りはＡＲ。ずれは為替差損益"],["「子会社Ｓ社は親会社Ｐ社に対して…売り上げている。そのときの為替相場」","売上高のうち親会社向けだけＨＲ、残りはＡＲ。親会社の仕入と消し合うから"],["長期借入金のうち親会社からの借入に「借入時の為替相場」が添えてある","使わない。Ｂ/Ｓ項目は内部取引でも全額ＣＲ。親会社の貸付金もＣＲなので消しても差が出ない"],["Ｂ/Ｓの利益剰余金に「株主資本等変動計算書の利益剰余金当期末残高」","レートを当てずに株変の貸借差額をそのまま移す。期首の円額－配当（ＨＲ）＋当期純利益（ＡＲ）の合成"]],"steps":[["損益計算書を先に換算する","全科目と当期純利益をＡＲ。親会 function rnd(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (((h >>> 0) % 99991) + 1) / 99992; }

    .sort((a, b) => b.k - a.k).map(x => x.v);
}

let shortWatch = null;
function watchShorts() {
  if (shortWatch) { shortWatch.disconnect(); shortWatch = null; }
  const box = document.getElementById("shorts");
  if (!box || !("IntersectionObserver" in window)) return;
  shortWatch = new IntersectionObserver(es => es.forEach(e => {
    const vid = e.target.querySelector("video");
    if (!vid) return;
    if (e.isIntersecting && e.intersectionRatio >= .6) vid.play().catch(() => {}); else vid.pause();
  }), { root: box, threshold: [0, .6] });
  box.querySelectorAll(".short").forEach(a => {
    shortWatch.observe(a);
    const vid = a.querySelector("video"), bar = a.querySelector(".sline i");
    if (!vid) return;
    vid.addEventListener("timeupdate", () => { if (vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100).toFixed(1) + "%"; });
    vid.addEventListener("click", () => { if (vid.paused) vid.play().catch(() => {}); else vid.pause(); });
  });
}

function results() {
  const words = norm(q).trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "";
  const hit = V.filter(v => {
    const c = (v.core ? JSON.stringify(v.core) : "") + (v.script ? JSON.stringify(v.script) : "");
    const h = norm([v.no, isExam(v) ? "過去問 第" + v.no + " " + v.sn : isProb(v) ? "問題" + v.no : "講義" + v.no, v.title, v.sub, chName(v.sub, v.ch), v.hl, c, ...(v.probs || [])].join(" "));
    return words.every(w => h.includes(w));
  });
  return hit.map(v => li(v.id)).join("") || '<p class="empty">見つかりませんでした</p>';
}

  openSheet(`<div class="sheeth"><h2>台本</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody scr" data-id="${id}">${v.script.map((ls, i) => `<section class="sc">
      <button class="sch" data-sseek="${v.scenes[i][0]}"><span class="no">${mmss(v.scenes[i][0])}</span><b>${esc(v.scenes[i][1])}</b></button>
      ${ls.map(([w, t]) => `<p><i class="${w === "めたん" ? "m" : "z"}">${esc(w)}</i><span>${esc(t)}</span></p>`).join("")}</section>`).join("")}</div>`, false, playing === id);
  markScene();
}
function saveSheet(k) {
  sheetKey = k;
  openSheet(`<div class="sheeth"><h2>保存先</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody">
      <div class="fold">${S.folders.map(f => `<label><input type="checkbox" data-fold="${f.id}" ${f.ids.includes(k) ? "checked" : ""}>${esc(f.name)}</label>`).join("")}</div>
      <form class="newf" data-newf><input id="newname" maxlength="20" placeholder="新しいフォルダ" aria-label="新しいフォルダの名前"><button>作る</button></form>
    </div>`, true);
}
function newFolderSheet() {
  sheetKey = null;
  openSheet(`<div class="sheeth"><h2>新しいフォルダ</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody"><form class="newf" data-newf><input id="newname" maxlength="20" placeholder="フォルダの名前" aria-label="フォルダの名前"><button>作る</button></form></div>`, true);
}
function menuSheet(k, ctx) {
  sheetKey = k; sheetCtx = ctx || "";
  const v = byId[keyId(k)], s = isShort(k), f = sheetCtx.startsWith("folder:") ? folderOf(sheetCtx.slice(7)) : null;
  const it = (m, ic, t) => `<button data-m="${m}">${ic}<span>${t}</span></button>`;
  const later = folderOf(LATER);
  openSheet(`<div class="sheeth"><h2 class="sm">${s ? "ショート・" : ""}${name(v)}</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="menu">
      ${sheetCtx === "queue" ? it("unqueue", I.trash, "「次に再生」から外す") : ""}
      ${!s && v.video && sheetCtx !== "queue" && k !== playing ? it("next", I.qnext, "次に再生") + it("last", I.qlast, "最後に再生") : ""}
      ${later && !later.ids.includes(k) ? it("later", I.clock, "［後で見る］に保存") : ""}
      ${it("fav", I.mark(false), "お気に入りリストに保存")}
      ${f ? it("unfolder", I.trash, `［${esc(f.name)}］から削除`) : ""}
      ${s ? "" : it("done", I.check(false), finished(v.id) ? "未視聴に戻す" : seen(v.id) ? "見終わったにする／未視聴に戻す" : "見終わったにする")}
    </div>`, true);
}
function setDone(id, on) {
  if (on) S.prog[id] = Object.assign({ t: 0, d: 0 }, pg(id), { at: Date.now(), done: true });
  else S.prog[id] = { t: 0, d: 0, at: Date.now(), x: 1 };
  markProg(id); flush();
}
function doMenu(m) {
  const k = sheetKey, id = keyId(k), ctx = sheetCtx;
  if (m === "fav") return saveSheet(k);
  if (m === "done" && !finished(id) && seen(id)) {
    return openSheet(`<div class="sheeth"><h2 class="sm">${name(byId[id])}</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
      <div class="menu"><button data-m="done1">${I.check(false)}<span>見終わったにする</span></button><button data-m="done0">${I.trash}<span>未視聴に戻す</span></button></div>`, true);
  }
  if (m === "next") { queue = [id].concat(queue.filter(x => x !== id)); toast("次に再生します"); }
  else if (m === "last") { queue = queue.filter(x => x !== id).concat(id); toast("最後に再生します"); }
  else if (m === "unqueue") { queue = queue.filter(x => x !== id); }
  else if (m === "later") { const f = folderOf(LATER); if (!f.ids.includes(k)) f.ids.push(k); markLib(); toast("［後で見る］に保存しました"); }
  else if (m === "unfolder") { const f = folderOf(ctx.slice(7)); if (f) { f.ids = f.ids.filter(x => x !== k); markLib(); toast(`［${f.name}］から削除しました`); } }
  else if (m === "done") setDone(id, !finished(id));
  else if (m === "done1") setDone(id, true);
  else if (m === "done0") setDone(id, false);
  back();
}
function playAll(fid) {
  const f = folderOf(fid); if (!f) return;
  const ids = folderItems(f).filter(k => !isShort(k) && byId[k].video);
  if (!ids.length) return;
  queue = ids.slice(1);
  leave(); openPlayer(ids[0], null, false, false);
  const vid = document.getElementById("vid"); if (vid) vid.play().catch(() => {});
}

// ---------- 操作 ----------
document.addEventListener("click", e => {
  if (e.target.id === "scrim") return back();
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if ("back" in d) back();
  else if ("search" in d) { leave(); searching = true; pushLayer(); render(); const i = document.getElementById("q"); if (i) i.focus(); }
  else if (d.tab) { leave(); tab = d.tab; showAll = false; meView = null; searching = false; render(); }
  else if (d.chip) { homeChip = d.chip; rerender(); }
  else if (d.fchip) { fChip = d.fchip; rerender(); }
  else if (d.ch) { leave(); pickCh = d.ch; if (showAll) back(); else render(); }
  else if ("all" in d) { leave(); showAll = true; pushLayer(); render(); }
  else if ("hist" in d) { leave(); meView = "hist"; pushLayer(); render(); }
  else if (d.folder) { leave(); meView = d.folder; fChip = "すべて"; pushLayer(); render(); }
  else if ("newfolder" in d) newFolderSheet();
  else if ("accts" in d) acctSheet();
  else if (d.acct) { flush(); try { localStorage.setItem(MOCK_ACCT, d.acct); } catch (e) {} location.reload(); }
  else if (d.playall) playAll(d.playall);
  else if (d.more) menuSheet(d.more, d.ctx);
  else if (d.m) doMenu(d.m);
  else if (d.short) {
    leave(); searching = false; meView = null; tab = "shorts";
    scrollMem.shorts = 0; render();
    const box = document.getElementById("shorts"), a = box && box.querySelector(`[data-sid="${d.short}"]`);
    if (a) box.scrollTop = a.offsetTop;
  }
  else if (d.open) {
    const vid = document.getElementById("vid"); if (vid) vid.pause();
    closeSheet(true);
    const inPlayer = !document.getElementById("player").hidden;
    if (!inPlayer) leave();
    openPlayer(d.open, d.at != null ? +d.at : null, d.fs === "1", inPlayer);
  }
  else if (d.seek) {
    const id = sheetKey, vid = document.getElementById("vid");
    closeSheet(true);
    if (playing === id && vid) { vid.currentTime = +d.seek; vid.play().catch(() => {}); }
    else { const inPlayer = !!playing; if (!inPlayer) leave(); openPlayer(id, +d.seek, tab === "shorts" && !inPlayer, inPlayer); }
  }
  else if ("full" in d) goFull();
  else if (d.script) scriptSheet(d.script);
  else if (d.sseek) {
    const vid = document.getElementById("vid");
    if (playing === sheetKey && vid) { vid.currentTime = +d.sseek; vid.play().catch(() => {}); markScene(); }
    else { const id = sheetKey, inPlayer = !!playing; closeSheet(true); if (!inPlayer) leave(); openPlayer(id, +d.sseek, tab === "shorts" && !inPlayer, inPlayer); }
  }
  else if (d.about) about(d.about);
  else if (d.save) saveSheet(d.save);
  else if (d.done) { setDone(d.done, !finished(d.done)); refreshPlayer(); }
  else if ("auto" in d) { S.set.auto = !S.set.auto; markSet(); flush(); refreshPlayer(); }
  else if (d.rate) {
    S.set.rate = +d.rate; markSet(); flush();
    const vid = document.getElementById("vid"); if (vid) vid.playbackRate = S.set.rate;
    document.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.rate === S.set.rate)));
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { q = e.target.value; document.getElementById("res").innerHTML = results(); }
});
document.addEventListener("change", e => {
  const d = e.target.dataset;
  if (d.fold != null && sheetKey) {
    const f = folderOf(d.fold);
    if (!f) return;
    if (e.target.checked) { if (!f.ids.includes(sheetKey)) f.ids.push(sheetKey); } else f.ids = f.ids.filter(x => x !== sheetKey);
    markLib();
  }
});
document.addEventListener("submit", e => {
  if (!e.target.matches("[data-newf]")) return;
  e.preventDefault();
  const n = document.getElementById("newname").value.trim();
  if (!n) return;
  S.folders.push({ id: "f" + Date.now().toString(36), name: n, ids: sheetKey ? [sheetKey] : [] }); markLib();
  if (sheetKey) saveSheet(sheetKey); else back();
});
render();
connect();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
